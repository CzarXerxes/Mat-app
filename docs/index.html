<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E6A4E">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Meny og handleliste for en periode ut fra budsjett, tid og ernæring, med logg over hva du har spist.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
img{max-width:100%}
</style>
<title>Matplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width app column, sticky header, fixed bottom tab bar, bottom sheet for recipes */
:root{
  --bg:#EFF2EC; --surface:#FFFFFF; --sunk:#E5EAE2; --ink:#18201A; --muted:#5C685F; --line:#D5DDD2;
  --herb:#2E6A4E; --herb-ink:#FFFFFF; --beet:#9A2B5B; --mustard:#B98A1F; --leaf:#6FA287;
  --good:#2E6A4E; --warn:#A86A12; --bad:#B42318;
  --shadow:0 1px 2px rgba(24,32,26,.06),0 8px 24px rgba(24,32,26,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111512; --surface:#1A1F1B; --sunk:#232A25; --ink:#E5EBE4; --muted:#98A49B; --line:#2D3630;
  --herb:#7CC3A0; --herb-ink:#0E1A13; --beet:#E37DA8; --mustard:#E0B657; --leaf:#5E9A7C;
  --good:#7CC3A0; --warn:#E0B657; --bad:#F2877C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#1A1F1B; --sunk:#232A25; --ink:#E5EBE4; --muted:#98A49B; --line:#2D3630;
  --herb:#7CC3A0; --herb-ink:#0E1A13; --beet:#E37DA8; --mustard:#E0B657; --leaf:#5E9A7C;
  --good:#7CC3A0; --warn:#E0B657; --bad:#F2877C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--herb);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.brand svg{width:28px;height:28px;flex:none}
.pill{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk);padding:5px 10px;border-radius:999px;white-space:nowrap}

h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em}
.lede{color:var(--muted);margin:4px 0 0}
.view{display:flex;flex-direction:column;gap:16px;padding-top:4px}

/* Summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-head{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.meter-head .lbl{font-weight:600}
.meter-head .val{color:var(--muted)}
.track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.fill{height:100%;background:var(--herb);border-radius:4px;transition:width .4s ease}
.fill.over{background:var(--bad)}
.seg{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.c-p{background:var(--beet)} .c-f{background:var(--mustard)} .c-k{background:var(--leaf)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;align-self:flex-start}
.status.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.status.over{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.status.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn:active{transform:translateY(1px)}

/* Days */
.day{display:flex;flex-direction:column;gap:8px}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-inline:2px}
.day-head h3{font-size:17px}
.day-head .meta{font-size:12px;color:var(--muted)}
.meals{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.meal{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal-main{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px 4px 12px 14px;min-width:0}
.meal-main:focus-visible{outline:2px solid var(--herb);outline-offset:-2px}
.mtype{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--herb)}
.mname{font-weight:600;font-size:15.5px;line-height:1.3}
.mmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.mmeta span{display:inline-flex;align-items:center;gap:4px}
.mmeta svg{width:13px;height:13px}
.flag{color:var(--warn);font-weight:600}
.swap{border:0;background:transparent;color:var(--muted);width:44px;height:44px;margin-right:6px;border-radius:12px;display:grid;place-items:center}
.swap:hover{background:var(--sunk);color:var(--ink)}
.swap svg{width:19px;height:19px}
.swap.spin svg{animation:spin .45s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-slot{padding:14px;color:var(--muted);font-size:14px}

/* Shopping list */
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px 16px;box-shadow:var(--shadow)}
.group h4{margin:16px 0 4px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item input{position:absolute;opacity:0;pointer-events:none}
.box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;transition:background .15s}
.box svg{width:13px;height:13px;opacity:0;color:var(--herb-ink)}
.item input:checked + .box{background:var(--herb);border-color:var(--herb)}
.item input:checked + .box svg{opacity:1}
.item input:focus-visible + .box{outline:2px solid var(--herb);outline-offset:2px}
.iname{min-width:0}
.item input:checked ~ .iname{text-decoration:line-through;color:var(--muted)}
.iamt{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.icost{font-size:13px;text-align:right;min-width:52px;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);margin-top:10px;padding-top:12px;font-family:var(--f-mono);font-weight:500}
.total .big{font-size:20px}
.pantry{background:var(--sunk);border-radius:14px;padding:12px 14px;font-size:14px}
.pantry b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted)}

/* Settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.field{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.field label.t,.field .t{font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:40px;height:38px;font-size:20px;line-height:1}
.stepper output{min-width:42px;text-align:center;font-family:var(--f-mono);font-weight:500}
input[type=number],input[type=date]{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:130px;text-align:right;font-family:var(--f-mono)}
input[type=date]{width:auto;text-align:left}
input[type=range]{width:100%;accent-color:var(--herb)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.chip input:checked + span{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.chip input:focus-visible + span{outline:2px solid var(--herb);outline-offset:2px}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prof{position:relative}
.prof input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.prof .pc{display:flex;flex-direction:column;gap:7px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;height:100%}
.prof .pc b{font-size:14px}
.prof .pc small{color:var(--muted);font-size:12px}
.prof input:checked + .pc{border-color:var(--herb);box-shadow:inset 0 0 0 1px var(--herb);background:color-mix(in srgb,var(--herb) 7%,var(--surface))}
.prof input:focus-visible + .pc{outline:2px solid var(--herb);outline-offset:2px}
.prof .track{height:6px}

/* Tab bar */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px;position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--herb)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);background:var(--beet);color:#fff;font-size:10.5px;font-family:var(--f-mono);border-radius:999px;padding:1px 6px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,11,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(460px,100%);max-height:86%;overflow:auto;border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-size:23px;letter-spacing:-.02em}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fact{background:var(--sunk);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.fact b{font-family:var(--f-mono);font-weight:500;font-size:15px}
.fact span{font-size:11px;color:var(--muted)}
.sheet h3{font-size:15px;font-family:var(--f-body);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ilist li span:last-child{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.steps li::marker{font-family:var(--f-mono);color:var(--herb)}

.rest{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--herb);margin-top:2px}
.rest svg{width:13px;height:13px;flex:none}
.from{font-size:10.5px;font-weight:600;color:var(--herb);margin-left:8px;text-transform:uppercase;letter-spacing:.06em}
.iname small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.iname small.fresh{color:var(--warn)}
.fill.warnfill{background:var(--warn)}
.after{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px 14px;display:flex;flex-direction:column;gap:6px}
.after h4{margin:12px 0 2px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.after-head{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px;padding-top:6px}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.wrow span:nth-child(2){color:var(--muted);font-size:13px}
.wrow span:nth-child(3){min-width:48px;text-align:right;font-size:13px}
.keep{margin:0;font-size:14px;color:var(--muted)}
.meal.skipped{background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--line) 45%,transparent) 9px 10px)}
.meal.skipped .mname{color:var(--muted)}
.meal.skipped .mtype{color:var(--muted)}
.logged{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--beet);margin-top:2px}
.logged svg{width:12px;height:12px}
.txt{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit}
textarea.txt{resize:vertical;min-height:62px}
.field-s{display:flex;flex-direction:column;gap:8px}
.field-s .t{font-weight:600}
.matrix-wrap{overflow-x:auto;margin-inline:-4px}
.matrix{border-collapse:separate;border-spacing:4px;width:100%}
.matrix th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;white-space:nowrap;padding-right:4px}
.matrix thead th{text-align:center}
.cell{width:100%;min-width:66px;height:34px;border:1px solid color-mix(in srgb,var(--herb) 30%,var(--line));border-radius:9px;background:color-mix(in srgb,var(--herb) 10%,var(--surface));color:var(--herb);display:grid;place-items:center;font-size:12px;font-weight:600}
.cell svg{width:14px;height:14px}
.cell.off{background:var(--sunk);color:var(--muted);border:1px dashed var(--muted)}
.daychips{display:flex;gap:6px;overflow-x:auto;padding-block:2px 6px;scrollbar-width:none}
.dchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);text-transform:capitalize;position:relative;min-width:50px}
.dchip b{font-family:var(--f-display);font-size:17px;color:var(--ink)}
.dchip.on{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.dchip.on b{color:var(--herb-ink)}
.dchip.today:not(.on){border-color:var(--herb)}
.dotlog{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--beet)}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.lhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lhead .plan{font-size:13px;color:var(--muted);text-align:right;min-width:0}
.lentry{display:flex;flex-direction:column;gap:3px;min-width:0}
.lentry b{font-weight:600}
.lentry .note{margin:0}
.srctag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap;vertical-align:1px}
.srctag.ai{color:var(--beet);background:color-mix(in srgb,var(--beet) 12%,transparent)}
.lnum{font-size:12.5px;color:var(--muted)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.sm svg{width:15px;height:15px}
.btn:disabled{opacity:.55;cursor:default}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px}
.mini .track{height:6px}
.mini .num{color:var(--muted);font-size:12px;text-align:right}
.fill.c-p{background:var(--beet)} .fill.c-f{background:var(--mustard)} .fill.c-k{background:var(--leaf)}
.nutr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nutr label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.nutr input{width:100%;text-align:right}
@media (max-width:380px){.nutr{grid-template-columns:repeat(2,1fr)}}
.photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo-row img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.or{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:500;font-size:14px}
.chip-btn.on{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.estout{margin:0}
.estout.err{color:var(--bad)}
.section-h{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px -6px}
.trainline{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);padding-inline:2px;margin-top:-4px}
.trainline span{display:inline-flex;align-items:center;gap:5px}
.trainline svg{width:14px;height:14px;color:var(--mustard)}
.trainline .done{color:var(--herb);font-weight:600}
.kos{display:flex;flex-direction:column;gap:12px}
.kos-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kos-big{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.kos-big small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.kos-big.neg{color:var(--bad)}
.kos-rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kos-rows span:nth-child(even){font-family:var(--f-mono);text-align:right}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wday{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600;text-transform:capitalize}
.wbar{width:100%;height:56px;border-radius:7px;background:var(--sunk);position:relative;overflow:hidden}
.wbar .earn{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--herb) 30%,transparent)}
.wbar .use{position:absolute;left:0;right:0;bottom:0;background:var(--beet)}
.wday.future .wbar{opacity:.5}
.wday.sel{color:var(--ink)}
.wday.sel .wbar{outline:2px solid var(--herb);outline-offset:1px}
.legend .c-e{background:color-mix(in srgb,var(--herb) 30%,transparent)}
select.sel,.sel{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;max-width:100%}
.res{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.res b{font-family:var(--f-mono);font-weight:500}
.split{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;font-size:14px}
.split input{width:70px}
.split .kc{font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:right;min-width:72px}
.split .kosrow{font-weight:600;color:var(--herb)}
.split .kosrow.kc{color:var(--herb)}
.snack{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.snack .num{font-size:13px;color:var(--muted)}
.xbtn{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1}
.xbtn:hover{background:var(--sunk);color:var(--ink)}
.inline-add{display:grid;grid-template-columns:1fr 90px auto;gap:8px}
.inline-add input{width:100%}
.sess-meta{font-size:12.5px;color:var(--muted)}
.prog{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.prog:last-child{border-bottom:0}
.prog b{font-weight:600}
.dows{display:flex;gap:6px;flex-wrap:wrap}
.dows .chip span{min-width:42px;text-align:center;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:30;box-shadow:var(--shadow)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- Recipe math ---------- */
function flags(r){return r.i.map(([id])=>ING[id].f).join("")}
function allowed(r,s){
  const f=flags(r);
  if(s.diet==="pesk"&&f.includes("m"))return false;
  if(s.diet==="vegetar"&&/[mf]/.test(f))return false;
  if(s.diet==="vegan"&&(/[mfde]/.test(f)||r.i.some(([id])=>id==="honning")))return false;
  if(s.allergies.gluten&&f.includes("g"))return false;
  if(s.allergies.laktose&&f.includes("d"))return false;
  if(s.allergies.egg&&f.includes("e"))return false;
  return true;
}
function costPer(r){return r.i.reduce((sum,[id,a])=>sum+a*unit(ING[id]),0)}
const unit = g => g.pp/g.pk;
const fresh = g => g.h!==undefined && g.h<=10;
const short = g => g.sn || g.n.split(/[ ,]/)[0].toLowerCase();
function kcal(r){const[p,f,k]=r.mac;return p*4+f*9+k*4}
function macroPct(r){const e=kcal(r),[p,f,k]=r.mac;return{p:p*4/e*100,f:f*9/e*100,k:k*4/e*100}}
function macroDist(r,prof){const m=macroPct(r);return(Math.abs(m.p-prof.p)+Math.abs(m.f-prof.f)+Math.abs(m.k-prof.k))/100}

/* ---------- Planner ---------- */
function slotMaxTime(dateObj){const wd=dateObj.getDay();return(wd===0||wd===6)?S.tWeekend:S.tWeek}
function slotBudget(meal){const active=MEALS.filter(m=>S.meals[m]);const tot=active.reduce((a,m)=>a+MEAL_SHARE[m],0);return S.budget/S.days*(MEAL_SHARE[meal]/tot)}
function candidates(meal,maxT){
  const all=R.filter(r=>r.m===meal&&allowed(r,S));
  const ok=all.filter(r=>r.t<=maxT);
  if(ok.length)return{list:ok,relaxed:false};
  return{list:all.sort((a,b)=>a.t-b.t).slice(0,3),relaxed:all.length>0};
}

/* Kjøleskapet: partier (lots) av hver vare med mengde og siste brukedag */
function newInv(){return{lots:[],buy:{},used:{},waste:{}}}
function lotsOf(inv,id,day){return inv.lots.filter(l=>l.id===id&&l.amt>1e-6&&l.exp>=day).sort((a,b)=>a.exp-b.exp)}
function expire(inv,day){inv.lots=inv.lots.filter(l=>{if(l.amt<=1e-6)return false;if(l.exp<day){inv.waste[l.id]=(inv.waste[l.id]||0)+l.amt;return false}return true})}
function quote(inv,r,day,mult){
  let marg=0,restVal=0,newLeft=0;const rest=[];
  for(const[id,a0]of r.i){const g=ING[id];if(g.c==="basis")continue;const a=a0*(mult??S.persons);
    const av=lotsOf(inv,id,day).reduce((x,l)=>x+l.amt,0);const from=Math.min(av,a);
    if(from>1e-6&&fresh(g)){restVal+=from*unit(g);rest.push(id)}
    const need=a-from;if(need>1e-6){const packs=Math.ceil(need/g.pk-1e-9);marg+=packs*g.pp;if(fresh(g))newLeft+=(packs*g.pk-need)*unit(g)}}
  return{marg,restVal,rest,newLeft};
}
function apply(inv,r,day,mult){
  for(const[id,a0]of r.i){const g=ING[id];if(g.c==="basis")continue;let need=a0*(mult??S.persons);
    inv.used[id]=(inv.used[id]||0)+need;
    for(const l of lotsOf(inv,id,day)){const take=Math.min(l.amt,need);l.amt-=take;need-=take;if(need<=1e-6)break}
    if(need>1e-6){const packs=Math.ceil(need/g.pk-1e-9);inv.buy[id]=(inv.buy[id]||0)+packs;inv.lots.push({id,amt:packs*g.pk-need,exp:day+(g.h??9999)})}}
}
function walk(slots,upto,inv,onSlot){
  let day=-1;
  for(let j=0;j<upto;j++){const s=slots[j];
    if(s.d!==day){for(let d=day+1;d<=s.d;d++){expire(inv,d);applySnacks(inv,d)}day=s.d}
    if(s.id){const r=RBY[s.id],tp=totalPortions(r,s.meal);onSlot&&onSlot(j,quote(inv,r,s.d,tp));apply(inv,r,s.d,tp)}}
  return day;
}
function invBefore(slots,idx){const inv=newInv();const day=walk(slots,idx,inv);for(let d=day+1;d<=slots[idx].d;d++){expire(inv,d);applySnacks(inv,d)}return inv}
function simulate(slots){
  const inv=newInv();const info=[];
  walk(slots,slots.length,inv,(j,q)=>info[j]=q);
  expire(inv,S.days);
  const cost=Object.entries(inv.buy).reduce((a,[id,n])=>a+n*ING[id].pp,0);
  const left={};inv.lots.forEach(l=>{if(l.amt>1e-6)left[l.id]=(left[l.id]||0)+l.amt});
  const wasteItems={...inv.waste};
  Object.entries(left).forEach(([id,a])=>{if(fresh(ING[id]))wasteItems[id]=(wasteItems[id]||0)+a});
  const wasteVal=Object.entries(wasteItems).reduce((a,[id,x])=>a+x*unit(ING[id]),0);
  return{cost,buy:inv.buy,used:inv.used,info,left,wasteItems,wasteVal};
}

function score(r,meal,used,prevPr,inv,day){
  const prof=PROFILES[S.profile],sb=slotBudget(meal),tp=totalPortions(r,meal),full=costPer(r)*tp;
  let c=full,bonus=0;
  if(S.smartRest&&inv){const q=quote(inv,r,day,tp);c=q.marg*.6+full*.4;bonus=q.restVal/sb*1.5-q.newLeft/sb*2}
  const costPen=Math.max(0,c-sb)/sb*2+c/sb*.3;
  const rep=(used[r.id]||0)*(meal==="middag"?1.6:.5);
  const same=(meal==="middag"&&prevPr&&prevPr===r.pr)?(bonus>0?.3:.7):0;
  return macroDist(r,prof)*3+costPen+rep+same-bonus+portionPen(r,meal);
}
function generate(seed){
  const rand=rng(seed);const used={};const slots=[];let prevPr=null;const inv=newInv();
  for(let d=0;d<S.days;d++){
    expire(inv,d);applySnacks(inv,d);
    const date=addDays(S.start,d);const maxT=slotMaxTime(date);
    for(const meal of MEALS){if(!S.meals[meal])continue;
      if(skips[iso(date)+"|"+meal]){slots.push({d,meal,id:null,skip:true});continue}
      const{list,relaxed}=candidates(meal,maxT);
      if(!list.length){slots.push({d,meal,id:null});continue}
      const ranked=list.map(r=>({r,s:score(r,meal,used,prevPr,inv,d)})).sort((a,b)=>a.s-b.s);
      const top=ranked.slice(0,3);const w=[.55,.3,.15].slice(0,top.length);const sum=w.reduce((a,b)=>a+b,0);
      let x=rand()*sum,pick=top[0].r;for(let i=0;i<top.length;i++){x-=w[i];if(x<=0){pick=top[i].r;break}}
      used[pick.id]=(used[pick.id]||0)+1;if(meal==="middag")prevPr=pick.pr;
      apply(inv,pick,d,totalPortions(pick,meal));
      slots.push({d,meal,id:pick.id,relaxed});
    }
  }
  if(S.smartRest)improve(slots);
  repairBudget(slots);
  return{seed,slots,sig:sig()};
}
/* Lokal forbedring: bytt enkeltretter når det gir lavere sum av handlekurv, svinn og avvik fra profil/variasjon (alt i kroner) */
function objective(slots){
  const sim=simulate(slots),prof=PROFILES[S.profile];let pen=0;const seen={};let prev=null;
  slots.forEach(s=>{if(!s.id)return;const r=RBY[s.id],sb=slotBudget(s.meal);
    pen+=macroDist(r,prof)*1.5*sb;
    if(seen[s.id])pen+=sb*(s.meal==="middag"?1.3:.25);seen[s.id]=1;
    if(s.meal==="middag"){if(prev===r.pr)pen+=sb*.15;prev=r.pr}});
  return sim.cost+sim.wasteVal*1.2+pen;
}
function improve(slots){
  let base=objective(slots);
  for(let pass=0;pass<2;pass++){let changed=false;
    slots.forEach(s=>{if(!s.id)return;const cur=s.id;
      const{list}=candidates(s.meal,slotMaxTime(addDays(S.start,s.d)));
      let best=cur,bestV=base;
      for(const c of list){if(c.id===cur)continue;s.id=c.id;const v=objective(slots);if(v<bestV-4){bestV=v;best=c.id}}
      s.id=best;if(best!==cur){base=bestV;changed=true}});
    if(!changed)break}
}
function repairBudget(slots){
  const prof=PROFILES[S.profile];
  for(let it=0;it<40;it++){
    const base=simulate(slots).cost;if(base<=S.budget)break;
    const used={};slots.forEach(s=>{if(s.id)used[s.id]=(used[s.id]||0)+1});
    let best=null;
    slots.forEach((s,idx)=>{if(!s.id)return;const cur=s.id;
      const{list}=candidates(s.meal,slotMaxTime(addDays(S.start,s.d)));
      for(const c of list){if(c.id===cur||costPer(c)>=costPer(RBY[cur]))continue;
        s.id=c.id;const save=base-simulate(slots).cost;s.id=cur;if(save<=.5)continue;
        const pen=macroDist(c,prof)*3+(used[c.id]||0)*(s.meal==="middag"?1.6:.5)+.01;
        const ratio=pen/save;if(!best||ratio<best.ratio)best={idx,id:c.id,ratio}}
    });
    if(!best)break;slots[best.idx].id=best.id;
  }
}
function sig(){return JSON.stringify([S.start,S.days,S.persons,S.meals,S.diet,S.allergies,S.profile,S.smartRest,2])}

  Object.entries(SIM.buy).forEach(([id,n])=>{const g=ING[id];const left=n*g.pk-(SIM.used[id]||0);
    (groups[g.c]=groups[g.c]||[]).push({id,name:g.n,amt:fmtPack(g,n),cost:n*g.pp,leftStr:left>1e-6?fmtQty(g,left):"",fresh:fresh(g)})});
  Object.values(groups).forEach(l=>l.sort((a,b)=>a.name.localeCompare(b.name,"nb")));
  return{groups,pantry:[...pantry].sort((a,b)=>a.localeCompare(b,"nb"))};
}
function sizeStr(u,a){
  if(u==="g")return a>=1000?(a/1000).toLocaleString("nb-NO")+" kg":a+" g";
  if(u==="ml")return a>=1000?(a/1000).toLocaleString("nb-NO")+" l":a>=100?(a/100).toLocaleString("nb-NO")+" dl":a+" ml";
  return a+" stk";
}
function fmtPack(g,n){
  if(g.u==="stk"&&g.pk===1)return n+" "+(g.pn||g.s||"stk");
  if(g.u==="stk")return n+" "+(g.pn||"pk")+" à "+g.pk+" "+(g.s||"stk");
  return n+" × "+sizeStr(g.u,g.pk);
}
function fmtQty(g,a){
  if(g.u==="stk"){const n=Math.round(a*2)/2;return(n||.5).toLocaleString("nb-NO")+" "+(g.s||"stk")}
  if(a>=1000)return(a/1000).toLocaleString("nb-NO",{maximumFractionDigits:1})+" "+(g.u==="g"?"kg":"l");
  if(g.u==="ml"&&a>=100)return(a/100).toLocaleString("nb-NO",{maximumFractionDigits:1})+" dl";
  return(Math.round(a/5)*5||Math.round(a)||1)+" "+g.u;
}

function fmtRecipeAmt(g,a){

/* ---------- Actions ---------- */
function swapSlot(idx){
  const s=P.slots[idx]; const {list}=candidates(s.meal,slotMaxTime(addDays(S.start,s.d)));
  const used={};P.slots.forEach(x=>{if(x.id)used[x.id]=(used[x.id]||0)+1});
  const inv=invBefore(P.slots,idx);
  const ranked=list.map(r=>({r,sc:score(r,s.meal,used,null,inv,s.d)})).sort((a,b)=>a.sc-b.sc).map(x=>x.r);
  if(ranked.length<2){toast("Ingen andre retter passer dette måltidet");return}
  s.tried=s.tried||[]; s.tried.push(s.id);
  let next=ranked.find(r=>!s.tried.includes(r.id));
  if(!next){s.tried=[s.id];next=ranked.find(r=>r.id!==s.id)}
  s.id=next.id; save(); renderAll();
  toast("Byttet til "+next.n);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-open]"); if(!t)return;
  if(t.dataset.tab)return setTab(t.dataset.tab);
  if(t.dataset.go)return setTab(t.dataset.go);
  if(t.dataset.open!==undefined)return openRecipe(+t.dataset.open);
  if(t.dataset.swap!==undefined){const idx=+t.dataset.swap;if(t.hasAttribute("data-close"))closeSheet();t.classList.add("spin");return swapSlot(idx)}
  if(t.id==="closeSheet")return closeSheet();
  if(t.dataset.skipopen!==undefined)return openSkip(+t.dataset.skipopen);
  if(t.dataset.unskip!==undefined){const s=P.slots[+t.dataset.unskip];if(t.hasAttribute("data-close"))closeSheet();setSkips([slotKey(s)],null);return toast(MEAL_LABEL[s.meal]+" er planlagt igjen")}
  if(t.dataset.cell!==undefined){const idx=+t.dataset.cell,s=P.slots[idx];if(!s)return;if(s.skip){setSkips([slotKey(s)],null);return toast(MEAL_LABEL[s.meal]+" er planlagt igjen")}return openSkip(idx)}
  if(t.id==="skipSave")return saveSkip(+t.dataset.idx);
  if(t.dataset.logday!==undefined){logDay=+t.dataset.logday;renderLogg();renderTrening();return}
  if(t.dataset.quick!==undefined)return quickLog(+t.dataset.quick);
  if(t.dataset.logedit!==undefined)return openLog(t.dataset.logedit);
  if(t.dataset.logdel!==undefined)return deleteLog(t.dataset.logdel);
  if(t.dataset.portion!==undefined)return pickPortion(+t.dataset.portion);
  if(t.id==="l-est")return estimate();
  if(t.id==="l-save")return saveLogEntry();
  if(v4Click(t))return;
  if(t.id==="reroll"){newPlan();return toast("Ny variant av menyen er klar")}
  if(t.id==="clearChecks"){checked={};save();return renderListe()}
  if(t.id==="copyList")return copyList();
  if(t.dataset.step){const k=t.dataset.step,lim={days:[1,14],persons:[1,8]}[k];S[k]=Math.min(lim[1],Math.max(lim[0],S[k]+ +t.dataset.d));$("#o-"+k).textContent=S[k];updateHints();save();return}
  if(t.id==="makePlan"){newPlan();setTab("meny");toast("Menyen og handlelisten er oppdatert")}
});
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#scrim").hidden)closeSheet()});
document.addEventListener("change",e=>{
  const t=e.target;
  if(v4Change(t))return;
  if(t.id==="l-photo"){pickPhoto(t);return}
  if(t.name==="l-type"||t.name==="sk-r"||t.name==="sk-rep"||(t.id&&/^(l-|sk-)/.test(t.id)))return;
  if(t.dataset.check){checked[t.dataset.check]=t.checked;save();renderListe();return}
  if(t.id==="f-start"&&t.value)S.start=t.value;
  if(t.id==="f-budget")S.budget=Math.max(100,+t.value||S.budget);
  if(t.id==="f-kcal")S.kcal=Math.min(4500,Math.max(1200,+t.value||S.kcal));
  if(t.dataset.meal){S.meals[t.dataset.meal]=t.checked;if(!MEALS.some(m=>S.meals[m])){S.meals[t.dataset.meal]=true;t.checked=true;toast("Velg minst ett måltid")}}
  if(t.name==="profile")S.profile=t.value;
  if(t.name==="diet")S.diet=t.value;
  if(t.id==="f-smart")S.smartRest=t.checked;
  if(t.dataset.al)S.allergies[t.dataset.al]=t.checked;
  updateHints(); save();
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(v4Input(t))return;
  if(["l-kcal","l-p","l-f","l-k"].includes(t.id)){LOGCTX.src="manual";document.querySelectorAll("[data-portion]").forEach(b=>b.classList.remove("on"));return}
  if(t.id==="l-desc"||t.id==="sk-note")return;

  if(t.id==="f-tweekend"){S.tWeekend=+t.value;$("#o-tweekend").textContent=S.tWeekend+" min"}
  if(t.id==="f-budget"&&+t.value>0){S.budget=+t.value}

function updateHints(){
  const hb=$("#h-budget"); if(hb)hb.textContent="≈ "+nf(S.budget/S.persons/S.days)+" kr per person per dag";

async function copyList(){
  const {groups,pantry}=shoppingList();
  let txt="Handleliste\n";
  CAT_ORDER.forEach(c=>{if(!groups[c])return;txt+="\n"+CATS[c]+"\n";groups[c].forEach(i=>{txt+=(checked[i.id]?"[x] ":"[ ] ")+i.name+" – "+i.amt+"\n"})});

/* ---------- Måltider som ikke skal planlegges ---------- */
const REASONS = {restaurant:"Restaurant", jobb:"Jobb eller konferanse", besok:"Hos andre", borte:"Bortreist", annet:"Annet"};
const REASON_SHORT = {restaurant:"Restaurant", jobb:"Jobb", besok:"Besøk", borte:"Borte", annet:"Ute"};
const slotKey = s => iso(addDays(S.start,s.d))+"|"+s.meal;
const isWeekend = d => d.getDay()===0||d.getDay()===6;
const fmtDow = d => new Intl.DateTimeFormat("nb-NO",{weekday:"short",day:"numeric"}).format(d);
function bestFor(idx){
  const s=P.slots[idx];const{list}=candidates(s.meal,slotMaxTime(addDays(S.start,s.d)));if(!list.length)return null;
  const used={};P.slots.forEach(x=>{if(x.id)used[x.id]=(used[x.id]||0)+1});
  const inv=invBefore(P.slots,idx);
  return list.map(r=>({r,sc:score(r,s.meal,used,null,inv,s.d)})).sort((a,b)=>a.sc-b.sc)[0].r.id;
}
function applySkipsToPlan(){
  P.slots.forEach((s,idx)=>{const k=slotKey(s);
    if(skips[k]){if(!s.skip){s.skip=true;if(s.id)s.prev=s.id;s.id=null}}
    else if(s.skip){s.skip=false;s.id=(s.prev&&RBY[s.prev]&&allowed(RBY[s.prev],S))?s.prev:bestFor(idx);delete s.prev}});
}
function setSkips(keys,val){keys.forEach(k=>{if(val)skips[k]=val;else delete skips[k]});applySkipsToPlan();save();renderAll()}
function openSkip(idx){
  const s=P.slots[idx];const date=addDays(S.start,s.d);const key=slotKey(s);const cur=skips[key]||{r:"restaurant",note:""};
  $("#sheet").innerHTML=`<span class="grab"></span>
   <div><span class="mtype">Ikke planlegg</span><h2 id="sheetTitle">${MEAL_LABEL[s.meal]} ${fmtDay(date)}</h2></div>
   <p class="note">Måltidet tas ut av menyen og handlelisten. Du kan fortsatt føre opp hva du spiste i loggen.</p>
   <div class="field-s"><span class="t">Hvor spiser du?</span><div class="chips">${Object.entries(REASONS).map(([k,n])=>`<label class="chip"><input type="radio" name="sk-r" value="${k}" ${cur.r===k?"checked":""}><span>${n}</span></label>`).join("")}</div></div>
   <div class="field-s"><label class="t" for="sk-note">Notat</label><input type="text" id="sk-note" class="txt" maxlength="80" placeholder="F.eks. jubileumsmiddag" value="${esc(cur.note||"")}"></div>
   <div class="field-s"><span class="t">Gjelder</span><div class="chips">
     <label class="chip"><input type="radio" name="sk-rep" value="one" checked><span>Bare denne dagen</span></label>
     <label class="chip"><input type="radio" name="sk-rep" value="weekdays"><span>Alle hverdager</span></label>
     <label class="chip"><input type="radio" name="sk-rep" value="all"><span>Alle dager</span></label></div>
     <span class="hint">Gjentakelse gjelder ${MEAL_LABEL[s.meal].toLowerCase()} i denne perioden.</span></div>
   <div class="actions">${skips[key]?`<button class="btn" data-unskip="${idx}" data-close>Planlegg likevel</button>`:""}<button class="btn" id="closeSheet">Avbryt</button><button class="btn primary" id="skipSave" data-idx="${idx}">Lagre</button></div>`;
  $("#scrim").hidden=false; $("#skipSave").focus();
}
function saveSkip(idx){
  const s=P.slots[idx];
  const r=document.querySelector('input[name="sk-r"]:checked')?.value||"annet";
  const note=$("#sk-note").value.trim();
  const rep=document.querySelector('input[name="sk-rep"]:checked')?.value||"one";
  const keys=P.slots.filter(x=>x.meal===s.meal&&(rep==="all"||(rep==="one"?x.d===s.d:!isWeekend(addDays(S.start,x.d))))).map(slotKey);
  if(rep==="weekdays"&&!keys.includes(slotKey(s)))keys.push(slotKey(s));
  closeSheet(); setSkips(keys,{r,note});
  toast(keys.length>1?keys.length+" måltider er tatt ut av menyen":"Måltidet er tatt ut av menyen");
}
function skipMatrix(){
  const ms=MEALS.filter(m=>P.slots.some(s=>s.meal===m));
  let h=`<div class="matrix-wrap"><table class="matrix"><thead><tr><th scope="col"><span class="sr">Dag</span></th>${ms.map(m=>`<th scope="col">${MEAL_LABEL[m]}</th>`).join("")}</tr></thead><tbody>`;
  const days=Math.max(...P.slots.map(s=>s.d))+1;
  for(let d=0;d<days;d++){const date=addDays(S.start,d);
    h+=`<tr><th scope="row">${cap(fmtDow(date))}</th>`;
    ms.forEach(m=>{const idx=P.slots.findIndex(s=>s.d===d&&s.meal===m);const s=P.slots[idx];
      if(!s){h+="<td></td>";return}
      const sk=s.skip&&skips[slotKey(s)];
      h+=`<td><button class="cell ${sk?"off":""}" data-cell="${idx}" aria-label="${MEAL_LABEL[m]} ${fmtDay(date)}: ${sk?"ikke planlagt, "+REASONS[sk.r]:"planlagt"}">${sk?esc(REASON_SHORT[sk.r]||"Ute"):ICON.tick}</button></td>`});
    h+="</tr>"}
  return h+"</tbody></table></div>";
}

/* ---------- Logg ---------- */
const SRC = {plan:"Fra menyen", manual:"Oppgitt", ai:"Anslått av Claude", db:"Grovt anslag"};
const LOG_TYPES = ["Mellommåltid","Kos","Frokost","Lunsj","Middag","Kveldsmat"];
let LOGCTX = {};
const monthOf = ds => ds.slice(0,7);
function dayLog(ds,create){const m=monthOf(ds);if(!LOG[m]){if(!create)return null;LOG[m]={}}if(!LOG[m][ds]){if(!create)return null;LOG[m][ds]={slots:{},extra:[],train:[]}}return LOG[m][ds]}
function saveLog(ds){const m=monthOf(ds);LOGMETA[m]=Date.now();store.set("log",LOG);store.set("logmeta",LOGMETA);queueLog(m)}
function dayTotals(dl){const t={kcal:0,p:0,f:0,k:0,n:0};if(!dl)return t;[...Object.values(dl.slots||{}),...(dl.extra||[])].forEach(e=>{t.kcal+=+e.kcal||0;t.p+=+e.p||0;t.f+=+e.f||0;t.k+=+e.k||0;t.n++});return t}
const portionLabel = p => p===.5?"½":p===1.5?"1½":(+p).toLocaleString("nb-NO",{maximumFractionDigits:2});
function entryFromRecipe(r,p){return{name:r.n+(p!==1?` (${portionLabel(p)} porsjon)`:""),kcal:Math.round(kcal(r)*p),p:Math.round(r.mac[0]*p),f:Math.round(r.mac[1]*p),k:Math.round(r.mac[2]*p),src:"plan",recipeId:r.id,portion:p,t:Date.now()}}
function loggedTag(s){const dl=dayLog(iso(addDays(S.start,s.d)));const e=dl&&dl.slots[s.meal];return e?`<span class="logged">${ICON.tick}Logget · ${nf(e.kcal)} kcal</span>`:""}
function entryHtml(e,key){
  return `<div class="lentry"><div><b>${esc(e.name)}</b><span class="srctag ${e.src==="ai"?"ai":""}">${SRC[e.src]||"Oppgitt"}</span></div>
    <span class="lnum num">${nf(e.kcal)} kcal · P ${nf(e.p)} g · F ${nf(e.f)} g · K ${nf(e.k)} g</span>${e.note?`<p class="note">${esc(e.note)}</p>`:""}</div>
    <div class="actions"><button class="btn sm" data-logedit="${key}">Endre</button><button class="btn sm" data-logdel="${key}">Fjern</button></div>`;
}
function renderLogg(){
  const el=$("#v-logg"); if(!el)return;
  const todayIdx=(()=>{const t=iso(new Date());for(let d=0;d<S.days;d++)if(iso(addDays(S.start,d))===t)return d;return -1})();
  if(logDay===null||logDay>=S.days)logDay=todayIdx>=0?todayIdx:0;
  const date=addDays(S.start,logDay), ds=iso(date);
  if(cloud.db&&!cloud.loaded.has(monthOf(ds)))loadMonth(monthOf(ds)).then(()=>renderLogg());
  const dl=dayLog(ds), tot=dayTotals(dl), prof=PROFILES[S.profile];
  const goalK=logBase()+trainBonus(ds);const tg={p:goalK*prof.p/100/4,f:goalK*prof.f/100/9,k:goalK*prof.k/100/4};
  const daySlots=P.slots.map((s,idx)=>({...s,idx})).filter(s=>s.d===logDay);
  const remaining=daySlots.filter(s=>s.id&&!(dl&&dl.slots[s.meal])).reduce((a,s)=>a+kcal(RBY[s.id]),0);
  let loggedDays=0,sumK=0;
  for(let d=0;d<S.days;d++){const t=dayTotals(dayLog(iso(addDays(S.start,d))));if(t.n){loggedDays++;sumK+=t.kcal}}
  const goal=goalK;const pct=Math.min(100,tot.kcal/goal*100), over=tot.kcal>goal*1.1;
  const bar=(lbl,v,t,c)=>`<span>${lbl}</span><span class="track"><span class="fill ${c}" style="width:${Math.min(100,v/t*100)}%"></span></span><span class="num">${nf(v)} / ${nf(t)} g</span>`;
  let h=`<div><h1>Logg</h1><p class="lede">Før opp hva du faktisk har spist. Loggen gjelder deg, ikke hele husstanden.</p></div>
  <div class="daychips" role="group" aria-label="Velg dag">${Array.from({length:S.days},(_,d)=>{const dt=addDays(S.start,d);const has=dayTotals(dayLog(iso(dt))).n>0;
    return `<button class="dchip ${d===logDay?"on":""} ${d===todayIdx?"today":""}" data-logday="${d}" aria-pressed="${d===logDay}">${new Intl.DateTimeFormat("nb-NO",{weekday:"short"}).format(dt).replace(".","")}<b>${dt.getDate()}</b>${has?'<i class="dotlog" aria-label="har logg"></i>':""}</button>`}).join("")}</div>
  <div class="summary">
    <div class="stats">
      <div class="stat"><span class="k">Spist</span><span class="v">${nf(tot.kcal)}<small> kcal</small></span></div>
      <div class="stat"><span class="k">Mål${trainBonus(ds)?" + trening":""}</span><span class="v">${nf(goal)}<small> kcal</small></span></div>
      <div class="stat"><span class="k">Planlagt igjen</span><span class="v">${nf(remaining)}<small> kcal</small></span></div>
    </div>
    <div class="meter">
      <div class="meter-head"><span class="lbl">${cap(fmtDay(date))}</span><span class="val num">${Math.round(tot.kcal/goal*100)} % av dagsbehovet</span></div>
      <div class="track" role="img" aria-label="${Math.round(tot.kcal/goal*100)} prosent av dagsbehovet"><div class="fill ${over?"over":""}" style="width:${pct}%"></div></div>
    </div>
    <div class="mini">${bar("Protein",tot.p,tg.p,"c-p")}${bar("Fett",tot.f,tg.f,"c-f")}${bar("Karbo",tot.k,tg.k,"c-k")}</div>
    <span class="note">${loggedDays} av ${S.days} dager i perioden har logg${loggedDays?` · snitt ${nf(sumK/loggedDays)} kcal per logget dag`:""}.</span>
  </div>`;
  h+=kosCard(ds);
  daySlots.forEach(s=>{
    const e=dl&&dl.slots[s.meal]; const sk=s.skip&&skips[slotKey(s)];
    const plan=s.id?esc(RBY[s.id].n):sk?"Ikke planlagt · "+esc(REASONS[sk.r]||"Annet"):"Ingen rett planlagt";
    h+=`<div class="lcard"><div class="lhead"><span class="mtype">${MEAL_LABEL[s.meal]}</span><span class="plan">${plan}</span></div>`;
    if(e)h+=entryHtml(e,s.meal);
    else h+=`<div class="actions">${s.id?`<button class="btn sm primary" data-quick="${s.idx}">${ICON.tick}Spist som planlagt</button>`:""}<button class="btn sm" data-logedit="${s.meal}">${s.id?"Spiste noe annet":"Før opp hva du spiste"}</button></div>`;
    h+=`</div>`;
  });
  const extra=(dl&&dl.extra)||[];
  h+=snackLogCard(ds);
  h+=`<h2 class="section-h">Andre måltider og mellommåltider</h2>`;
  extra.forEach((e,i)=>{h+=`<div class="lcard"><div class="lhead"><span class="mtype">${esc(e.type||"Mellommåltid")}</span></div>${entryHtml(e,"x:"+i)}</div>`});
  h+=`<button class="btn" data-logedit="x:new">${ICON.plus}Legg til måltid eller mellommåltid</button>`;
  el.innerHTML=h;
}
function quickLog(idx){

  dayLog(ds,true).slots[s.meal]=entryFromRecipe(RBY[s.id],myPortion(RBY[s.id],s.meal));saveLog(ds);renderLogg();renderMeny();toast("Lagt i loggen");
}
function deleteLog(key){

  if(key.startsWith("x:"))dl.extra.splice(+key.slice(2),1);else delete dl.slots[key];

     <label for="l-f">Fett, g<input type="number" id="l-f" inputmode="numeric" min="0" value="${v("f")}"></label>

async function estimate(){

function localEstimate(txt){
  let s=" "+txt.toLowerCase()+" ";const items=[];const t={kcal:0,p:0,f:0,k:0};
  const words=FOODS.flatMap(f=>f[0].split("|").map(w=>[w,f])).sort((a,b)=>b[0].length-a[0].length);
  const NUM={en:1,ett:1,ei:1,et:1,to:2,tre:3,fire:4,fem:5,seks:6,halv:.5,halvt:.5};
  for(const[w,f]of words){const re=new RegExp("(^|[^a-zæøå])"+w+(w.length<=3?"(?![a-zæøå])":""),"i");let m;
    while((m=re.exec(s))){const start=m.index+m[1].length;
      const qm=s.slice(Math.max(0,start-14),start).match(/(\d+(?:[.,]\d+)?|en|ett|et|ei|to|tre|fire|fem|seks|halv|halvt)\s+(?:[a-zæøå]+\s+)?$/);
      let q=1;if(qm){q=NUM[qm[1]]??parseFloat(qm[1].replace(",","."));if(!(q>0&&q<20))q=1}
      t.kcal+=f[2]*q;t.p+=f[3]*q;t.f+=f[4]*q;t.k+=f[5]*q;items.push((q!==1?String(q).replace(".",",")+" × ":"")+f[1]);
      s=s.slice(0,start)+" ".repeat(w.length)+s.slice(start+w.length)}}
  if(!items.length)return null;
  return{kcal:t.kcal,p:t.p,f:t.f,k:t.k,note:"Grovt anslag fra standardporsjoner: "+items.join(", ")+"."};
}

  lop:{n:"Løping",met:[7,9.8,11.5]}, gaa:{n:"Gåtur",met:[2.8,3.5,4.5]}, tur:{n:"Fjelltur eller skogstur",met:[5,6.5,8]},
  sykkel:{n:"Sykling",met:[5.8,7.5,10]}, spinning:{n:"Spinning",met:[6.8,8.5,10.5]}, styrke:{n:"Styrketrening",met:[3.5,5,6]},
  hiit:{n:"Intervall, HIIT eller crossfit",met:[6,8,10]}, svom:{n:"Svømming",met:[6,8,10]}, langrenn:{n:"Langrenn",met:[7,9,12.5]},
  yoga:{n:"Yoga eller tøying",met:[2.5,3,4]}, ballsport:{n:"Fotball eller ballsport",met:[6,8,10]}, racket:{n:"Padel, tennis eller badminton",met:[5,7,8]},
  annet:{n:"Annen trening",met:[4,6,8]},
};
const INTS = ["Lett","Moderat","Hard"];
const DOWS = ["Man","Tir","Ons","Tor","Fre","Lør","Søn"];
const dowOf = d => ((d.getDay()+6)%7)+1;
const weightKg = () => +S.me.w>0?+S.me.w:75;
function sessKcal(x){if(x.kcal!=null&&x.kcal!=="")return Math.round(+x.kcal);const a=ACTS[x.act]||ACTS.annet;return Math.round((a.met[x.int??1]-1)*weightKg()*(+x.min||0)/60)}
const sessName = x => (ACTS[x.act]||ACTS.annet).n;
const plannedFor = date => S.program.filter(p=>p.dows.includes(dowOf(date)));
const dayTrain = ds => {const dl=dayLog(ds);return(dl&&dl.train)||[]};
const trainBurn = ds => dayTrain(ds).reduce((a,x)=>a+sessKcal(x),0);
const trainInEnergy = () => !!(S.me.inclTrain&&S.program.length&&S.me.auto&&meReady());
const progAvg = () => S.program.reduce((a,p)=>a+sessKcal(p)*p.dows.length,0)/7*S.exFactor/100;
function trainBonus(ds){
  const burn=dayTrain(ds).reduce((a,x)=>{
    return a+sessKcal(x)},0);
  return Math.round(burn*S.exFactor/100);
}
function trainLine(date){
  const ds=iso(date),pl=plannedFor(date),done=dayTrain(ds);
  if(!pl.length&&!done.length)return"";
  const parts=pl.map(p=>{const d=done.find(x=>x.planId===p.id);return`<span class="${d?"done":""}">${ICON.run}${esc(sessName(p))} ${p.min} min${d?" · gjennomført":""}</span>`});
  done.filter(x=>!x.planId).forEach(x=>parts.push(`<span class="done">${ICON.run}${esc(sessName(x))} ${x.min} min · gjennomført</span>`));
  return`<div class="trainline">${parts.join("")}</div>`;
}

/* ---------- Kosekvote ---------- */
function weekDates(ds){const d=new Date(ds+"T12:00:00");const off=dowOf(d)-1;return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()-off+i);return iso(x)})}
function kosDay(ds,future){
  const lb=logBase(),share=kosShare()/100,base=lb*(1-share);
  let bonus=trainBonus(ds);
  if(future&&!dayTrain(ds).length)bonus=Math.round(plannedFor(new Date(ds+"T12:00:00")).reduce((a,p)=>a+sessKcal(p),0)*S.exFactor/100);
  const dl=dayLog(ds),t=dayTotals(dl);
  const kosE=((dl&&dl.extra)||[]).filter(e=>e.type==="Kos").reduce((a,e)=>a+(+e.kcal||0),0);
  const used=t.n?kosE+Math.max(0,(t.kcal-kosE)-base):0;
  return{earned:lb*share+bonus,bonus,used,kosE,base,logged:t.n>0};
}
function kosStatus(ds){
  const wk=weekDates(ds),today=iso(new Date());let carry=0,cur=null,future=0;const days=[];
  for(const x of wk){const isFut=x>today;const k=kosDay(x,isFut);days.push({ds:x,...k,fut:isFut});
    if(x<ds)carry+=k.earned-k.used;else if(x===ds)cur=k;else future+=k.earned;}
  const avail=carry+cur.earned-cur.used;
  return{carry,cur,avail,future,days,weekLeft:avail+future};
}
function kosCard(ds){
  if(kosShare()<=0)return`<div class="lcard"><div class="lhead"><span class="mtype">Kosekvote</span></div><p class="note" style="margin:0">Fordelingen bruker hele dagsbehovet, så det er ingen kosekvote. Juster den under Oppsett.</p></div>`;
  const k=kosStatus(ds),mx=Math.max(1,...k.days.map(d=>Math.max(d.earned,d.used)));
  return`<div class="lcard kos"><div class="lhead"><span class="mtype">Kosekvote</span><span class="plan">Uke ${isoWeek(new Date(ds+"T12:00:00"))} · nullstilles mandag</span></div>
    <div class="kos-top"><div class="kos-big ${k.avail<0?"neg":""}">${nf(k.avail)}<small> kcal igjen i dag</small></div><span class="note">Resten av uka kan du tjene ${nf(k.future)} kcal til.</span></div>
    <div class="kos-rows"><span>Overført fra tidligere i uka</span><span>${nf(k.carry)}</span><span>Opptjent i dag${k.cur.bonus?" (inkl. trening)":""}</span><span>+${nf(k.cur.earned)}</span><span>Brukt i dag</span><span>−${nf(k.cur.used)}</span></div>
    <div class="weekstrip" role="img" aria-label="Kosekvote per dag denne uka">${k.days.map((d,i)=>`<div class="wday ${d.fut?"future":""} ${d.ds===ds?"sel":""}"><div class="wbar"><span class="earn" style="height:${d.earned/mx*100}%"></span><span class="use" style="height:${d.used/mx*100}%"></span></div>${DOWS[i]}</div>`).join("")}</div>
    <div class="legend"><span><i class="dot c-e"></i>Opptjent</span><span><i class="dot c-p"></i>Brukt</span></div>
    <div class="actions"><button class="btn sm primary" data-logedit="x:kos">${ICON.plus}Før opp kos</button></div>
    <p class="note" style="margin:0">Det du fører opp som «Kos» trekkes alltid fra kvoten. Spiser du mer enn det som er satt av til måltider og faste mellommåltider (${nf(logBase()*(1-kosShare()/100))} kcal på en dag uten trening), trekkes også det fra. Gjennomførte økter øker kvoten for dagen. Dager uten logg teller som at kvoten ikke ble brukt.</p></div>`;
}
function snackLogCard(ds){
  if(!S.snacks.length)return"";
  const dl=dayLog(ds),ex=(dl&&dl.extra)||[];
  return`<div class="lcard"><div class="lhead"><span class="mtype">Faste mellommåltider</span><span class="plan">${nf(snackKcal())} kcal</span></div>
    ${S.snacks.map((sn,i)=>{const x=snackInfo(sn);const done=ex.some(e=>e.snackKey===(sn.id||sn.n));
      return`<div class="snack"><span>${esc(x.n)}</span><span class="num">${nf(x.kcal)} kcal</span>${done?`<span class="logged">${ICON.tick}Spist</span>`:`<button class="btn sm" data-snlog="${i}">Spist</button>`}</div>`}).join("")}</div>`;
}
function logSnack(i){
  const sn=S.snacks[i];if(!sn)return;const x=snackInfo(sn);const ds=iso(addDays(S.start,logDay));
  dayLog(ds,true).extra.push({name:x.n,kcal:x.kcal,p:x.p,f:x.f,k:x.k,src:"plan",type:"Mellommåltid",snackKey:sn.id||sn.n,t:Date.now()});
  saveLog(ds);renderLogg();renderMeny();toast("Lagt i loggen");
}

/* ---------- Trening: visning ---------- */
function renderTrening(){
  const el=$("#v-trening");if(!el)return;
  const todayIdx=(()=>{const t=iso(new Date());for(let d=0;d<S.days;d++)if(iso(addDays(S.start,d))===t)return d;return -1})();
  if(logDay===null||logDay>=S.days)logDay=todayIdx>=0?todayIdx:0;
  const date=addDays(S.start,logDay),ds=iso(date);
  const wk=weekDates(ds);let plannedN=0,doneN=0,mins=0,burn=0;
  wk.forEach(x=>{const dt=new Date(x+"T12:00:00");plannedN+=plannedFor(dt).length;const tr=dayTrain(x);doneN+=tr.length;mins+=tr.reduce((a,s)=>a+(+s.min||0),0);burn+=tr.reduce((a,s)=>a+sessKcal(s),0)});
  let h=`<div><h1>Trening</h1><p class="lede">Legg inn treningsprogrammet ditt og logg øktene. Forbrenningen legges til dagens kalorier og kosekvoten.</p></div>
  <div class="daychips" role="group" aria-label="Velg dag">${Array.from({length:S.days},(_,d)=>{const dt=addDays(S.start,d);const has=dayTrain(iso(dt)).length>0;
    return`<button class="dchip ${d===logDay?"on":""} ${d===todayIdx?"today":""}" data-logday="${d}" aria-pressed="${d===logDay}">${new Intl.DateTimeFormat("nb-NO",{weekday:"short"}).format(dt).replace(".","")}<b>${dt.getDate()}</b>${has?'<i class="dotlog" aria-label="har økt"></i>':""}</button>`}).join("")}</div>
  <div class="summary">
    <div class="stats">
      <div class="stat"><span class="k">Økter uke ${isoWeek(date)}</span><span class="v">${doneN}<small> av ${plannedN}</small></span></div>
      <div class="stat"><span class="k">Minutter</span><span class="v">${nf(mins)}</span></div>
      <div class="stat"><span class="k">Forbrent</span><span class="v">${nf(burn)}<small> kcal</small></span></div>
    </div>
    <span class="note">${cap(fmtDay(date))}: ${nf(trainBurn(ds))} kcal forbrent, ${nf(trainBonus(ds))} kcal (${S.exFactor} %) lagt til dagens mål og kosekvoten.${+S.me.w>0?"":" Legg inn vekten din under Oppsett for bedre anslag (bruker 75 kg)."}</span>
  </div>`;
  const pl=plannedFor(date),done=dayTrain(ds);
  h+=`<h2 class="section-h">Økter ${fmtDay(date)}</h2>`;
  pl.forEach(p=>{const d=done.findIndex(x=>x.planId===p.id);
    h+=`<div class="lcard"><div class="lhead"><span class="mtype">Planlagt</span><span class="plan">${esc(sessName(p))} · ${p.min} min · ${INTS[p.int].toLowerCase()}</span></div>`;
    if(d>=0)h+=sessHtml(done[d],d);
    else h+=`<div class="actions"><button class="btn sm primary" data-tdone="${p.id}">${ICON.tick}Gjennomført · ≈ ${nf(sessKcal(p))} kcal</button><button class="btn sm" data-topen="p:${p.id}">Endre og logg</button></div>`;
    h+=`</div>`});
  done.forEach((x,i)=>{if(x.planId&&pl.some(p=>p.id===x.planId))return;h+=`<div class="lcard"><div class="lhead"><span class="mtype">Økt</span></div>${sessHtml(x,i)}</div>`});
  if(!pl.length&&!done.length)h+=`<p class="note">Ingen økter planlagt denne dagen.</p>`;
  h+=`<button class="btn" data-topen="x:new">${ICON.plus}Logg en økt</button>`;
  h+=`<h2 class="section-h">Treningsprogram</h2><div class="card" style="padding-block:6px">${S.program.length?S.program.map(p=>`<div class="prog"><div><b>${esc(sessName(p))}</b><div class="sess-meta">${p.dows.map(d=>DOWS[d-1]).join(", ")} · ${p.min} min · ${INTS[p.int].toLowerCase()} · ≈ ${nf(sessKcal(p))} kcal${p.note?" · "+esc(p.note):""}</div></div><div class="actions"><button class="btn sm" data-popen="${p.id}">Endre</button></div></div>`).join(""):'<p class="note">Ingen økter i programmet ennå.</p>'}</div>
  <button class="btn" data-popen="new">${ICON.plus}Legg til økt i programmet</button>`;
  el.innerHTML=h;
}
function sessHtml(x,i){
  return`<div class="lentry"><div><b>${esc(sessName(x))}</b><span class="srctag">${x.kcal!=null&&x.kcal!==""?"Oppgitt":"Anslått"}</span></div>
    <span class="lnum num">${x.min} min · ${INTS[x.int??1].toLowerCase()} · ${nf(sessKcal(x))} kcal</span>${x.note?`<p class="note">${esc(x.note)}</p>`:""}</div>
    <div class="actions"><button class="btn sm" data-topen="i:${i}">Endre</button><button class="btn sm" data-tdel="${i}">Fjern</button></div>`;
}
function actSelect(id,val){return`<select class="sel" id="${id}">${Object.entries(ACTS).map(([k,a])=>`<option value="${k}" ${val===k?"selected":""}>${a.n}</option>`).join("")}</select>`}
function intChips(name,val){return`<div class="chips">${INTS.map((n,i)=>`<label class="chip"><input type="radio" name="${name}" value="${i}" ${val===i?"checked":""}><span>${n}</span></label>`).join("")}</div>`}
let TCTX={};
function openProgram(id){
  const p=id==="new"?{id:"p"+Date.now().toString(36),dows:[],act:"lop",min:45,int:1,note:""}:S.program.find(x=>x.id===id);if(!p)return;
  TCTX={kind:"prog",isNew:id==="new",p:{...p,dows:[...p.dows]}};
  $("#sheet").innerHTML=`<span class="grab"></span><div><span class="mtype">Treningsprogram</span><h2 id="sheetTitle">${id==="new"?"Ny økt i programmet":"Endre økt"}</h2></div>
   <div class="field-s"><span class="t">Dager</span><div class="dows">${DOWS.map((n,i)=>`<label class="chip"><input type="checkbox" name="tp-dow" value="${i+1}" ${p.dows.includes(i+1)?"checked":""}><span>${n}</span></label>`).join("")}</div></div>
   <div class="field-s"><label class="t" for="tp-act">Aktivitet</label>${actSelect("tp-act",p.act)}</div>
   <div class="field-s"><label class="t" for="tp-min">Varighet, minutter</label><input type="number" class="txt" id="tp-min" min="5" max="600" step="5" inputmode="numeric" value="${p.min}"></div>
   <div class="field-s"><span class="t">Intensitet</span>${intChips("tp-int",p.int)}</div>
   <div class="field-s"><label class="t" for="tp-note">Notat</label><input type="text" class="txt" id="tp-note" maxlength="80" placeholder="F.eks. 5 × 4 min intervall" value="${esc(p.note||"")}"></div>
   <p class="note estout" id="tp-est"></p>
   <div class="actions">${id!=="new"?`<button class="btn" data-pdel="${p.id}">Fjern fra programmet</button>`:""}<button class="btn" id="closeSheet">Avbryt</button><button class="btn primary" id="tp-save">Lagre</button></div>`;
  $("#scrim").hidden=false;updTEst("tp");
}
function readT(pre){
  return{act:$("#"+pre+"-act").value,min:Math.max(1,Math.round(+$("#"+pre+"-min").value||0)),int:+(document.querySelector(`input[name="${pre}-int"]:checked`)?.value??1),note:$("#"+pre+"-note").value.trim()};
}
function updTEst(pre){const x=readT(pre);if(pre==="ts"){const k=$("#ts-kcal").value;if(k!==""){$("#ts-est").textContent=`Bruker ${nf(+k)} kcal som du har oppgitt.`;return}}
  $("#"+pre+"-est").textContent=`Anslått forbrenning: ${nf(sessKcal(x))} kcal utover hvilestoffskiftet (${weightKg()} kg${+S.me.w>0?"":", standardvekt"}).`}
function saveProgram(){
  const x=readT("tp");const dows=[...document.querySelectorAll('input[name="tp-dow"]:checked')].map(i=>+i.value);
  if(!dows.length){const o=$("#tp-est");o.textContent="Velg minst én dag.";o.classList.add("err");return}
  const p={...TCTX.p,...x,dows};
  if(TCTX.isNew)S.program.push(p);else S.program=S.program.map(q=>q.id===p.id?p:q);
  closeSheet();save();renderAll();toast("Programmet er oppdatert");
}
function openSession(key){
  const ds=iso(addDays(S.start,logDay)),done=dayTrain(ds);
  let base,idx=null,planId=null;
  if(key.startsWith("p:")){planId=key.slice(2);const p=S.program.find(q=>q.id===planId);if(!p)return;base={act:p.act,min:p.min,int:p.int,note:p.note||"",kcal:""}}
  else if(key.startsWith("i:")){idx=+key.slice(2);base={...done[idx]};planId=base.planId||null;if(base.kcal==null)base.kcal=""}
  else base={act:"lop",min:30,int:1,note:"",kcal:""};
  TCTX={kind:"sess",ds,idx,planId};
  $("#sheet").innerHTML=`<span class="grab"></span><div><span class="mtype">Logg økt · ${fmtDay(addDays(S.start,logDay))}</span><h2 id="sheetTitle">Hva trente du?</h2></div>
   <div class="field-s"><label class="t" for="ts-act">Aktivitet</label>${actSelect("ts-act",base.act)}</div>
   <div class="field-s"><label class="t" for="ts-min">Varighet, minutter</label><input type="number" class="txt" id="ts-min" min="1" max="600" step="5" inputmode="numeric" value="${base.min}"></div>
   <div class="field-s"><span class="t">Intensitet</span>${intChips("ts-int",base.int??1)}</div>
   <div class="field-s"><label class="t" for="ts-kcal">Kalorier fra klokke eller app (valgfritt)</label><input type="number" class="txt" id="ts-kcal" min="0" inputmode="numeric" placeholder="La stå tom for anslag" value="${base.kcal}"><span class="hint">Klokker viser ofte totalt forbruk. Trekk gjerne fra hvileforbruket hvis den skiller på det.</span></div>
   <div class="field-s"><label class="t" for="ts-note">Notat</label><input type="text" class="txt" id="ts-note" maxlength="80" value="${esc(base.note||"")}"></div>
   <p class="note estout" id="ts-est"></p>
   <div class="actions"><button class="btn" id="closeSheet">Avbryt</button><button class="btn primary" id="ts-save">Lagre økten</button></div>`;
  $("#scrim").hidden=false;updTEst("ts");
}
function saveSession(){
  const x=readT("ts");const k=$("#ts-kcal").value;
  const e={...x,kcal:k===""?null:Math.round(+k),t:Date.now()};if(TCTX.planId)e.planId=TCTX.planId;
  const dl=dayLog(TCTX.ds,true);dl.train=dl.train||[];
  if(TCTX.idx!==null)dl.train[TCTX.idx]=e;else dl.train.push(e);
  closeSheet();saveLog(TCTX.ds);renderAll();toast("Økten er logget");
}
function quickTrain(planId){
  const p=S.program.find(q=>q.id===planId);if(!p)return;const ds=iso(addDays(S.start,logDay));
  const dl=dayLog(ds,true);dl.train=dl.train||[];dl.train.push({planId,act:p.act,min:p.min,int:p.int,note:p.note||"",kcal:null,t:Date.now()});
  saveLog(ds);renderAll();toast("Økten er logget");
}

/* ---------- Hendelser for profil, fordeling og trening ---------- */
function v4Change(t){
  const id=t.id||"",nm=t.name||"";
  if(nm==="me-sex"){S.me.sex=t.value}
  else if(["me-age","me-h","me-w"].includes(id)){const k=id.slice(3);S.me[k]=t.value===""?"":Math.max(0,+t.value)}
  else if(id==="me-pal"){S.me.pal=+t.value}
  else if(id==="me-goal"){S.me.goal=+t.value}
  else if(id==="me-auto"){S.me.auto=t.checked}
  else if(id==="me-train"){S.me.inclTrain=t.checked}
  else if(id==="sp-scale"){S.scalePortion=t.checked}
  else if(id==="me-ex"){S.exFactor=+t.value}
  else if(id.startsWith("sp-")){S.split[id.slice(3)]=Math.min(100,Math.max(0,Math.round(+t.value||0)))}
  else if(nm==="tp-dow"||nm==="tp-int"||id.startsWith("tp-")){updTEst("tp");return true}
  else if(nm==="ts-int"||id.startsWith("ts-")){updTEst("ts");return true}
  else if(id.startsWith("sn-"))return true;
  else return false;
  syncKcal();save();renderAll();return true;
}
function v4Input(t){
  const id=t.id||"";
  if(id==="me-ex"){$("#o-ex").textContent=t.value+" %";return true}
  if(id.startsWith("tp-")){updTEst("tp");return true}
  if(id.startsWith("ts-")){updTEst("ts");return true}
  if(id.startsWith("me-")||id.startsWith("sp-")||id.startsWith("sn-"))return true;
  return false;
}
function v4Click(t){
  const d=t.dataset;
  if(d.popen!==undefined){openProgram(d.popen);return true}
  if(d.pdel!==undefined){S.program=S.program.filter(p=>p.id!==d.pdel);closeSheet();save();renderAll();toast("Fjernet fra programmet");return true}
  if(t.id==="tp-save"){saveProgram();return true}
  if(d.topen!==undefined){openSession(d.topen);return true}
  if(t.id==="ts-save"){saveSession();return true}
  if(d.tdone!==undefined){quickTrain(d.tdone);return true}
  if(d.tdel!==undefined){const ds=iso(addDays(S.start,logDay));const dl=dayLog(ds);if(dl&&dl.train){dl.train.splice(+d.tdel,1);saveLog(ds);renderAll();toast("Økten er fjernet")}return true}
  if(d.snadd!==undefined){S.snacks.push({id:d.snadd});save();renderAll();return true}
  if(d.sndel!==undefined){S.snacks.splice(+d.sndel,1);save();renderAll();return true}
  if(t.id==="sn-add"){const n=$("#sn-name").value.trim(),k=+$("#sn-kcal").value;if(!n||!(k>0)){toast("Skriv navn og kalorier");return true}S.snacks.push({n,kcal:Math.round(k)});save();renderAll();return true}
  if(d.snlog!==undefined){logSnack(+d.snlog);return true}
  return false;
}

/* ---------- Porsjoner etter kaloribehov ---------- */
function myPortion(r,meal){
  if(!S.scalePortion||!r)return 1;
  const tgt=S.kcal*(+S.split[meal]||0)/100;if(!(tgt>0))return 1;
  return Math.min(2.5,Math.max(.5,Math.round(tgt/kcal(r)*4)/4));
}
const totalPortions = (r,meal) => myPortion(r,meal)+Math.max(0,S.persons-1);
function portionPen(r,meal){
  if(!S.scalePortion)return 0;const tgt=S.kcal*(+S.split[meal]||0)/100;if(!(tgt>0))return 0;
  return Math.max(0,Math.abs(Math.log(tgt/kcal(r)))-.15)*1.5;
}
const portionChoices = (r,meal) => [...new Set([.5,1,1.5,2,myPortion(r,meal)])].sort((a,b)=>a-b);

/* ---------- Boot ---------- */
syncKcal(); ensurePlan(); persistLocal(); renderAll(); setTab(store.get("tab","meny")); initCloud();
</script>
