<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2E6A4E">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Meny og handleliste for en periode ut fra budsjett, tid og ernæring, med logg over hva du har spist.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
img{max-width:100%}
</style>
<title>Matplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width app column, sticky header, fixed bottom tab bar, bottom sheet for recipes */
:root{
  --bg:#EFF2EC; --surface:#FFFFFF; --sunk:#E5EAE2; --ink:#18201A; --muted:#5C685F; --line:#D5DDD2;
  --herb:#2E6A4E; --herb-ink:#FFFFFF; --beet:#9A2B5B; --mustard:#B98A1F; --leaf:#6FA287;
  --good:#2E6A4E; --warn:#A86A12; --bad:#B42318;
  --shadow:0 1px 2px rgba(24,32,26,.06),0 8px 24px rgba(24,32,26,.08);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111512; --surface:#1A1F1B; --sunk:#232A25; --ink:#E5EBE4; --muted:#98A49B; --line:#2D3630;
  --herb:#7CC3A0; --herb-ink:#0E1A13; --beet:#E37DA8; --mustard:#E0B657; --leaf:#5E9A7C;
  --good:#7CC3A0; --warn:#E0B657; --bad:#F2877C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111512; --surface:#1A1F1B; --sunk:#232A25; --ink:#E5EBE4; --muted:#98A49B; --line:#2D3630;
  --herb:#7CC3A0; --herb-ink:#0E1A13; --beet:#E37DA8; --mustard:#E0B657; --leaf:#5E9A7C;
  --good:#7CC3A0; --warn:#E0B657; --bad:#F2877C; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--herb);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.02em}
.brand svg{width:28px;height:28px;flex:none}
.pill{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--sunk);padding:5px 10px;border-radius:999px;white-space:nowrap}

h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em}
.lede{color:var(--muted);margin:4px 0 0}
.view{display:flex;flex-direction:column;gap:16px;padding-top:4px}

/* Summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-head{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.meter-head .lbl{font-weight:600}
.meter-head .val{color:var(--muted)}
.track{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;display:flex}
.fill{height:100%;background:var(--herb);border-radius:4px;transition:width .4s ease}
.fill.over{background:var(--bad)}
.seg{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.c-p{background:var(--beet)} .c-f{background:var(--mustard)} .c-k{background:var(--leaf)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;align-self:flex-start}
.status.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.status.over{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.status.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--herb);color:var(--herb-ink);border-color:var(--herb)}
.btn.block{width:100%;padding:14px;font-size:16px}
.btn:active{transform:translateY(1px)}

/* Days */
.day{display:flex;flex-direction:column;gap:8px}
.day-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-inline:2px}
.day-head h3{font-size:17px}
.day-head .meta{font-size:12px;color:var(--muted)}
.meals{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.meal{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
.meal-main{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px 4px 12px 14px;min-width:0}
.meal-main:focus-visible{outline:2px solid var(--herb);outline-offset:-2px}
.mtype{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--herb)}
.mname{font-weight:600;font-size:15.5px;line-height:1.3}
.mmeta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.mmeta span{display:inline-flex;align-items:center;gap:4px}
.mmeta svg{width:13px;height:13px}
.flag{color:var(--warn);font-weight:600}
.swap{border:0;background:transparent;color:var(--muted);width:44px;height:44px;margin-right:6px;border-radius:12px;display:grid;place-items:center}
.swap:hover{background:var(--sunk);color:var(--ink)}
.swap svg{width:19px;height:19px}
.swap.spin svg{animation:spin .45s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-slot{padding:14px;color:var(--muted);font-size:14px}

/* Shopping list */
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 16px 16px;box-shadow:var(--shadow)}
.group h4{margin:16px 0 4px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item input{position:absolute;opacity:0;pointer-events:none}
.box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;transition:background .15s}
.box svg{width:13px;height:13px;opacity:0;color:var(--herb-ink)}
.item input:checked + .box{background:var(--herb);border-color:var(--herb)}
.item input:checked + .box svg{opacity:1}
.item input:focus-visible + .box{outline:2px solid var(--herb);outline-offset:2px}
.iname{min-width:0}
.item input:checked ~ .iname{text-decoration:line-through;color:var(--muted)}
.iamt{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.icost{font-size:13px;text-align:right;min-width:52px;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);margin-top:10px;padding-top:12px;font-family:var(--f-mono);font-weight:500}
.total .big{font-size:20px}
.pantry{background:var(--sunk);border-radius:14px;padding:12px 14px;font-size:14px}
.pantry b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.note{font-size:12.5px;color:var(--muted)}

/* Settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.field{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px solid var(--line)}
.field:first-child{border-top:0}
.field-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.field label.t,.field .t{font-weight:600}
.hint{font-size:12.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:40px;height:38px;font-size:20px;line-height:1}
.stepper output{min-width:42px;text-align:center;font-family:var(--f-mono);font-weight:500}
input[type=number],input[type=date]{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:130px;text-align:right;font-family:var(--f-mono)}
input[type=date]{width:auto;text-align:left}
input[type=range]{width:100%;accent-color:var(--herb)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.chip input:checked + span{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.chip input:focus-visible + span{outline:2px solid var(--herb);outline-offset:2px}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prof{position:relative}
.prof input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.prof .pc{display:flex;flex-direction:column;gap:7px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;height:100%}
.prof .pc b{font-size:14px}
.prof .pc small{color:var(--muted);font-size:12px}
.prof input:checked + .pc{border-color:var(--herb);box-shadow:inset 0 0 0 1px var(--herb);background:color-mix(in srgb,var(--herb) 7%,var(--surface))}
.prof input:focus-visible + .pc{outline:2px solid var(--herb);outline-offset:2px}
.prof .track{height:6px}

/* Tab bar */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(460px,100%);z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px;position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--herb)}
.badge{position:absolute;top:3px;left:calc(50% + 8px);background:var(--beet);color:#fff;font-size:10.5px;font-family:var(--f-mono);border-radius:999px;padding:1px 6px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,11,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(460px,100%);max-height:86%;overflow:auto;border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-size:23px;letter-spacing:-.02em}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fact{background:var(--sunk);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:1px;min-width:0}
.fact b{font-family:var(--f-mono);font-weight:500;font-size:15px}
.fact span{font-size:11px;color:var(--muted)}
.sheet h3{font-size:15px;font-family:var(--f-body);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ilist{list-style:none;margin:0;padding:0}
.ilist li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ilist li span:last-child{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.steps li::marker{font-family:var(--f-mono);color:var(--herb)}

.rest{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--herb);margin-top:2px}
.rest svg{width:13px;height:13px;flex:none}
.from{font-size:10.5px;font-weight:600;color:var(--herb);margin-left:8px;text-transform:uppercase;letter-spacing:.06em}
.iname small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.iname small.fresh{color:var(--warn)}
.fill.warnfill{background:var(--warn)}
.after{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 16px 14px;display:flex;flex-direction:column;gap:6px}
.after h4{margin:12px 0 2px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.after-head{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px;padding-top:6px}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;font-size:14px;padding:5px 0;border-bottom:1px dashed var(--line)}
.wrow span:nth-child(2){color:var(--muted);font-size:13px}
.wrow span:nth-child(3){min-width:48px;text-align:right;font-size:13px}
.keep{margin:0;font-size:14px;color:var(--muted)}
.meal.skipped{background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--line) 45%,transparent) 9px 10px)}
.meal.skipped .mname{color:var(--muted)}
.meal.skipped .mtype{color:var(--muted)}
.logged{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--beet);margin-top:2px}
.logged svg{width:12px;height:12px}
.txt{width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit}
textarea.txt{resize:vertical;min-height:62px}
.field-s{display:flex;flex-direction:column;gap:8px}
.field-s .t{font-weight:600}
.matrix-wrap{overflow-x:auto;margin-inline:-4px}
.matrix{border-collapse:separate;border-spacing:4px;width:100%}
.matrix th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;white-space:nowrap;padding-right:4px}
.matrix thead th{text-align:center}
.cell{width:100%;min-width:66px;height:34px;border:1px solid color-mix(in srgb,var(--herb) 30%,var(--line));border-radius:9px;background:color-mix(in srgb,var(--herb) 10%,var(--surface));color:var(--herb);display:grid;place-items:center;font-size:12px;font-weight:600}
.cell svg{width:14px;height:14px}
.cell.off{background:var(--sunk);color:var(--muted);border:1px dashed var(--muted)}
.daychips{display:flex;gap:6px;overflow-x:auto;padding-block:2px 6px;scrollbar-width:none}
.dchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);text-transform:capitalize;position:relative;min-width:50px}
.dchip b{font-family:var(--f-display);font-size:17px;color:var(--ink)}
.dchip.on{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.dchip.on b{color:var(--herb-ink)}
.dchip.today:not(.on){border-color:var(--herb)}
.dotlog{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--beet)}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.lhead{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lhead .plan{font-size:13px;color:var(--muted);text-align:right;min-width:0}
.lentry{display:flex;flex-direction:column;gap:3px;min-width:0}
.lentry b{font-weight:600}
.lentry .note{margin:0}
.srctag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--muted);background:var(--sunk);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap;vertical-align:1px}
.srctag.ai{color:var(--beet);background:color-mix(in srgb,var(--beet) 12%,transparent)}
.lnum{font-size:12.5px;color:var(--muted)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn.sm svg{width:15px;height:15px}
.btn:disabled{opacity:.55;cursor:default}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:12.5px}
.mini .track{height:6px}
.mini .num{color:var(--muted);font-size:12px;text-align:right}
.fill.c-p{background:var(--beet)} .fill.c-f{background:var(--mustard)} .fill.c-k{background:var(--leaf)}
.nutr{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nutr label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.nutr input{width:100%;text-align:right}
@media (max-width:380px){.nutr{grid-template-columns:repeat(2,1fr)}}
.photo-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.photo-row img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.or{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:500;font-size:14px}
.chip-btn.on{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.estout{margin:0}
.estout.err{color:var(--bad)}
.section-h{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px -6px}
.trainline{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);padding-inline:2px;margin-top:-4px}
.trainline span{display:inline-flex;align-items:center;gap:5px}
.trainline svg{width:14px;height:14px;color:var(--mustard)}
.trainline .done{color:var(--herb);font-weight:600}
.kos{display:flex;flex-direction:column;gap:12px}
.kos-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.kos-big{font-family:var(--f-display);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.kos-big small{font-family:var(--f-body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.kos-big.neg{color:var(--bad)}
.kos-rows{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px}
.kos-rows span:nth-child(even){font-family:var(--f-mono);text-align:right}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}

/* ---------- Recipe math ---------- */
function flags(r){return r.i.map(([id])=>ING[id].f).join("")}
function allowed(r,s){
  const f=flags(r);
  if(s.diet==="pesk"&&f.includes("m"))return false;
  if(s.diet==="vegetar"&&/[mf]/.test(f))return false;
  if(s.diet==="vegan"&&(/[mfde]/.test(f)||r.i.some(([id])=>id==="honning")))return false;
  if(s.allergies.gluten&&f.includes("g"))return false;
  if(s.allergies.laktose&&f.includes("d"))return false;
  if(s.allergies.egg&&f.includes("e"))return false;
  return true;
}
function costPer(r){if(r.own)return r.ppp||0;return r.i.reduce((sum,[id,a])=>sum+a*unit(ING[id]),0)}
const unit = g => g.pp/g.pk;
const fresh = g => g.h!==undefined && g.h<=10;
const short = g => g.sn || g.n.split(/[ ,]/)[0].toLowerCase();
function kcal(r){if(r.kcalOverride)return r.kcalOverride;const[p,f,k]=r.mac;return p*4+f*9+k*4}
function macroPct(r){const e=kcal(r),[p,f,k]=r.mac;return{p:p*4/e*100,f:f*9/e*100,k:k*4/e*100}}
function macroDist(r,prof){const m=macroPct(r);return(Math.abs(m.p-prof.p)+Math.abs(m.f-prof.f)+Math.abs(m.k-prof.k))/100}

function slotMaxTime(dateObj){const wd=dateObj.getDay();return(wd===0||wd===6)?S.tWeekend:S.tWeek}
function slotBudget(meal){const active=MEALS.filter(m=>S.meals[m]);const tot=active.reduce((a,m)=>a+MEAL_SHARE[m],0);return S.budget/S.days*(MEAL_SHARE[meal]/tot)}
function candidates(meal,maxT){
  const all=R.filter(r=>r.m===meal&&allowed(r,S));
  const ok=all.filter(r=>r.t<=maxT);
  if(ok.length)return{list:ok,relaxed:false};
  return{list:all.sort((a,b)=>a.t-b.t).slice(0,3),relaxed:all.length>0};
}

/* Kjøleskapet: partier (lots) av hver vare med mengde og siste brukedag */
function newInv(){return{lots:[],buy:{},used:{},waste:{}}}
function lotsOf(inv,id,day){return inv.lots.filter(l=>l.id===id&&l.amt>1e-6&&l.exp>=day).sort((a,b)=>a.exp-b.exp)}
function expire(inv,day){inv.lots=inv.lots.filter(l=>{if(l.amt<=1e-6)return false;if(l.exp<day){inv.waste[l.id]=(inv.waste[l.id]||0)+l.amt;return false}return true})}
function quote(inv,r,day,mult){
  let marg=0,restVal=0,newLeft=0;const rest=[];
  for(const[id,a0]of r.i){const g=ING[id];if(g.c==="basis")continue;const a=g.whole?Math.ceil(a0*(mult??S.persons)-1e-6):a0*(mult??S.persons);
    const av=lotsOf(inv,id,day).reduce((x,l)=>x+l.amt,0);const from=Math.min(av,a);
    if(from>1e-6&&fresh(g)){restVal+=from*unit(g);rest.push(id)}
    const need=a-from;if(need>1e-6){const packs=Math.ceil(need/g.pk-1e-9);marg+=packs*g.pp;if(fresh(g))newLeft+=(packs*g.pk-need)*unit(g)}}
  return{marg,restVal,rest,newLeft};
}
function apply(inv,r,day,mult){
  for(const[id,a0]of r.i){const g=ING[id];if(g.c==="basis")continue;let need=g.whole?Math.ceil(a0*(mult??S.persons)-1e-6):a0*(mult??S.persons);
    inv.used[id]=(inv.used[id]||0)+need;
    for(const l of lotsOf(inv,id,day)){const take=Math.min(l.amt,need);l.amt-=take;need-=take;if(need<=1e-6)break}
    if(need>1e-6){const packs=Math.ceil(need/g.pk-1e-9);inv.buy[id]=(inv.buy[id]||0)+packs;inv.lots.push({id,amt:packs*g.pk-need,exp:day+(g.h??9999)})}}
}
function walk(slots,upto,inv,onSlot){
  let day=-1;
  for(let j=0;j<upto;j++){const s=slots[j];
    if(s.d!==day){for(let d=day+1;d<=s.d;d++){expire(inv,d);applySnacks(inv,d)}day=s.d}
    if(s.id){const r=RBY[s.id],tp=totalPortions(r,s.meal,s.d);onSlot&&onSlot(j,quote(inv,r,s.d,tp));apply(inv,r,s.d,tp)}}
  return day;
}
function invBefore(slots,idx){const inv=newInv();const day=walk(slots,idx,inv);for(let d=day+1;d<=slots[idx].d;d++){expire(inv,d);applySnacks(inv,d)}return inv}
function simulate(slots){
  const inv=newInv();const info=[];
  walk(slots,slots.length,inv,(j,q)=>info[j]=q);
  expire(inv,S.days);
  const cost=Object.entries(inv.buy).reduce((a,[id,n])=>a+n*ING[id].pp,0);
  const left={};inv.lots.forEach(l=>{if(l.amt>1e-6)left[l.id]=(left[l.id]||0)+l.amt});
  const wasteItems={...inv.waste};
  Object.entries(left).forEach(([id,a])=>{if(fresh(ING[id]))wasteItems[id]=(wasteItems[id]||0)+a});
  const wasteVal=Object.entries(wasteItems).reduce((a,[id,x])=>a+x*unit(ING[id]),0);
  return{cost,buy:inv.buy,used:inv.used,info,left,wasteItems,wasteVal};
}

function score(r,meal,used,prevPr,inv,day){
  const prof=planProfile(),sb=slotBudget(meal),tp=totalPortions(r,meal,day),full=costPer(r)*tp;
  let c=full,bonus=0;
  if(S.smartRest&&inv){const q=quote(inv,r,day,tp);c=q.marg*.6+full*.4;bonus=q.restVal/sb*1.5-q.newLeft/sb*2}
  const costPen=Math.max(0,c-sb)/sb*2+c/sb*.3;
  const rep=(used[r.id]||0)*(meal==="middag"?1.6:.5);
  const same=(meal==="middag"&&prevPr&&prevPr===r.pr)?(bonus>0?.3:.7):0;
  return macroDist(r,prof)*3+costPen+rep+same-bonus+portionPen(r,meal,day);
}
function generate(seed){
  PPROF=null;
  const rand=rng(seed);const used={};const slots=[];let prevPr=null;const inv=newInv();
  for(let d=0;d<S.days;d++){
    expire(inv,d);applySnacks(inv,d);
    const date=addDays(S.start,d);const maxT=slotMaxTime(date);
    for(const meal of MEALS){if(!S.meals[meal])continue;
      if(skips[iso(date)+"|"+meal]){slots.push({d,meal,id:null,skip:true});continue}
      {const op=S.ownPlaced[iso(date)+"|"+meal];if(op&&RBY["own:"+op]){slots.push({d,meal,id:"own:"+op,own:true});used["own:"+op]=1;continue}}
      const{list,relaxed}=candidates(meal,maxT);
      if(!list.length){slots.push({d,meal,id:null});continue}
      const ranked=list.map(r=>({r,s:score(r,meal,used,prevPr,inv,d)})).sort((a,b)=>a.s-b.s);
      const top=ranked.slice(0,3);const w=[.55,.3,.15].slice(0,top.length);const sum=w.reduce((a,b)=>a+b,0);
      let x=rand()*sum,pick=top[0].r;for(let i=0;i<top.length;i++){x-=w[i];if(x<=0){pick=top[i].r;break}}
      used[pick.id]=(used[pick.id]||0)+1;if(meal==="middag")prevPr=pick.pr;
      apply(inv,pick,d,totalPortions(pick,meal,d));
      slots.push({d,meal,id:pick.id,relaxed});
    }
  }
  if(S.smartRest)improve(slots);
  repairBudget(slots);
  return{seed,slots,sig:sig()};
}
/* Lokal forbedring: bytt enkeltretter når det gir lavere sum av handlekurv, svinn og avvik fra profil/variasjon (alt i kroner) */
function objective(slots){
  const sim=simulate(slots),prof=planProfile();let pen=0;const seen={};let prev=null;
  slots.forEach(s=>{if(!s.id)return;const r=RBY[s.id],sb=slotBudget(s.meal);
    pen+=macroDist(r,prof)*1.5*sb;
    if(seen[s.id])pen+=sb*(s.meal==="middag"?1.3:.25);seen[s.id]=1;
    if(s.meal==="middag"){if(prev===r.pr)pen+=sb*.15;prev=r.pr}});
  return sim.cost+sim.wasteVal*1.2+pen;
}
function improve(slots){
  let base=objective(slots);
  for(let pass=0;pass<2;pass++){let changed=false;
    slots.forEach(s=>{if(!s.id||s.own)return;const cur=s.id;
      const{list}=candidates(s.meal,slotMaxTime(addDays(S.start,s.d)));
      let best=cur,bestV=base;
      for(const c of list){if(c.id===cur)continue;s.id=c.id;const v=objective(slots);if(v<bestV-4){bestV=v;best=c.id}}
      s.id=best;if(best!==cur){base=bestV;changed=true}});
    if(!changed)break}
}
function repairBudget(slots){
  const prof=PROFILES[S.profile];
  for(let it=0;it<40;it++){
    const base=simulate(slots).cost;if(base<=S.budget)break;
    const used={};slots.forEach(s=>{if(s.id)used[s.id]=(used[s.id]||0)+1});
    let best=null;
    slots.forEach((s,idx)=>{if(!s.id||s.own)return;const cur=s.id;
      const{list}=candidates(s.meal,slotMaxTime(addDays(S.start,s.d)));
      for(const c of list){if(c.id===cur||costPer(c)>=costPer(RBY[cur]))continue;
        s.id=c.id;const save=base-simulate(slots).cost;s.id=cur;if(save<=.5)continue;
        const pen=macroDist(c,prof)*3+(used[c.id]||0)*(s.meal==="middag"?1.6:.5)+.01;
        const ratio=pen/save;if(!best||ratio<best.ratio)best={idx,id:c.id,ratio}}
    });
    if(!best)break;slots[best.idx].id=best.id;
  }
}
function sig(){return JSON.stringify([S.start,S.days,S.persons,S.meals,S.diet,S.allergies,S.profile,S.smartRest,2])}

/* ---------- Shopping list ---------- */
function shoppingList(){
  const groups={};const pantry=new Set();
  P.slots.forEach(s=>{if(s.id)RBY[s.id].i.forEach(([id])=>{if(ING[id].c==="basis")pantry.add(ING[id].n)})});
  Object.entries(SIM.buy).forEach(([id,n])=>{const g=ING[id];const left=n*g.pk-(SIM.used[id]||0);
    (groups[g.c]=groups[g.c]||[]).push({id,name:g.n,amt:fmtPack(g,n),cost:n*g.pp,leftStr:left>1e-6?fmtQty(g,left):"",fresh:fresh(g)})});
  Object.values(groups).forEach(l=>l.sort((a,b)=>a.name.localeCompare(b.name,"nb")));
  return{groups,pantry:[...pantry].sort((a,b)=>a.localeCompare(b,"nb"))};
}
function sizeStr(u,a){
  if(u==="g")return a>=1000?(a/1000).toLocaleString("nb-NO")+" kg":a+" g";
  if(u==="ml")return a>=1000?(a/1000).toLocaleString("nb-NO")+" l":a>=100?(a/100).toLocaleString("nb-NO")+" dl":a+" ml";
  return a+" stk";
}
function fmtPack(g,n){
  if(g.u==="stk"&&g.pk===1)return n+" "+(g.pn||g.s||"stk");
  if(g.u==="stk")return n+" "+(g.pn||"pk")+" à "+g.pk+" "+(g.s||"stk");
  return n+" × "+sizeStr(g.u,g.pk);
}
function fmtQty(g,a){
  if(g.u==="stk"){const n=g.whole?Math.round(a):Math.round(a*2)/2;return(n||.5).toLocaleString("nb-NO")+" "+(g.s||"stk")}
  if(a>=1000)return(a/1000).toLocaleString("nb-NO",{maximumFractionDigits:1})+" "+(g.u==="g"?"kg":"l");
  if(g.u==="ml"&&a>=100)return(a/100).toLocaleString("nb-NO",{maximumFractionDigits:1})+" dl";
  return(Math.round(a/5)*5||Math.round(a)||1)+" "+g.u;
}

function fmtRecipeAmt(g,a){
  if(g.u==="stk"){const n=g.whole?Math.ceil(a-1e-6):Math.round(a*4)/4;const s=n%1===0?String(n):n.toLocaleString("nb-NO",{maximumFractionDigits:2});return s+" "+(g.s||"stk")}
  if(a>=1000)return(a/1000).toLocaleString("nb-NO",{maximumFractionDigits:2})+" "+(g.u==="g"?"kg":"l");
  if(g.u==="ml"&&a>=100)return(a/100).toLocaleString("nb-NO",{maximumFractionDigits:1})+" dl";
  return Math.round(a)+" "+g.u;
}

function swapSlot(idx){
  const s=P.slots[idx]; const {list}=candidates(s.meal,slotMaxTime(addDays(S.start,s.d)));
  const used={};P.slots.forEach(x=>{if(x.id)used[x.id]=(used[x.id]||0)+1});
  const inv=invBefore(P.slots,idx);
  const ranked=list.map(r=>({r,sc:score(r,s.meal,used,null,inv,s.d)})).sort((a,b)=>a.sc-b.sc).map(x=>x.r);
  if(ranked.length<2){toast("Ingen andre retter passer dette måltidet");return}
  s.tried=s.tried||[]; s.tried.push(s.id);
  let next=ranked.find(r=>!s.tried.includes(r.id));
  if(!next){s.tried=[s.id];next=ranked.find(r=>r.id!==s.id)}
  s.id=next.id; save(); renderAll();
  toast("Byttet til "+next.n);
}

const REASON_SHORT = {restaurant:"Restaurant", jobb:"Jobb", besok:"Besøk", borte:"Borte", annet:"Ute"};
const slotKey = s => iso(addDays(S.start,s.d))+"|"+s.meal;
const isWeekend = d => d.getDay()===0||d.getDay()===6;
const fmtDow = d => new Intl.DateTimeFormat("nb-NO",{weekday:"short",day:"numeric"}).format(d);
function bestFor(idx){
  const s=P.slots[idx];const{list}=candidates(s.meal,slotMaxTime(addDays(S.start,s.d)));if(!list.length)return null;
  const used={};P.slots.forEach(x=>{if(x.id)used[x.id]=(used[x.id]||0)+1});
  const inv=invBefore(P.slots,idx);
  return list.map(r=>({r,sc:score(r,s.meal,used,null,inv,s.d)})).sort((a,b)=>a.sc-b.sc)[0].r.id;
}
function applySkipsToPlan(){
  P.slots.forEach((s,idx)=>{const k=slotKey(s);
    if(skips[k]){if(!s.skip){s.skip=true;if(s.id)s.prev=s.id;s.id=null}}
    else if(s.skip){s.skip=false;s.id=(s.prev&&RBY[s.prev]&&allowed(RBY[s.prev],S))?s.prev:bestFor(idx);delete s.prev}});
}

function skipMatrix(){

  for(let d=0;d<days;d++){const date=addDays(S.start,d);

function localEstimate(txt){
  let s=" "+txt.toLowerCase()+" ";const items=[];const t={kcal:0,p:0,f:0,k:0};
  const words=FOODS.flatMap(f=>f[0].split("|").map(w=>[w,f])).sort((a,b)=>b[0].length-a[0].length);
  const NUM={en:1,ett:1,ei:1,et:1,to:2,tre:3,fire:4,fem:5,seks:6,halv:.5,halvt:.5};
  for(const[w,f]of words){const re=new RegExp("(^|[^a-zæøå])"+w+(w.length<=3?"(?![a-zæøå])":""),"i");let m;
    while((m=re.exec(s))){const start=m.index+m[1].length;
      const qm=s.slice(Math.max(0,start-14),start).match(/(\d+(?:[.,]\d+)?|en|ett|et|ei|to|tre|fire|fem|seks|halv|halvt)\s+(?:[a-zæøå]+\s+)?$/);
      let q=1;if(qm){q=NUM[qm[1]]??parseFloat(qm[1].replace(",","."));if(!(q>0&&q<20))q=1}
      t.kcal+=f[2]*q;t.p+=f[3]*q;t.f+=f[4]*q;t.k+=f[5]*q;items.push((q!==1?String(q).replace(".",",")+" × ":"")+f[1]);
      s=s.slice(0,start)+" ".repeat(w.length)+s.slice(start+w.length)}}
  if(!items.length)return null;
  return{kcal:t.kcal,p:t.p,f:t.f,k:t.k,note:"Grovt anslag fra standardporsjoner: "+items.join(", ")+"."};
}

      if(ps.exists&&(ps.data().updatedAt||0)>(PMETA.updatedAt||0)){const d=clean(ps.data());PERIODS=d.periods||{};PMETA.updatedAt=d.updatedAt;store.set("periods",PERIODS);store.set("periodsMeta",PMETA)}
      else if(PMETA.updatedAt)savePeriods(true);}catch(e){}
    rollPeriods(true);
    const months=new Set([...Object.keys(LOG),monthOf(iso(addDays(S.start,0))),monthOf(iso(addDays(S.start,S.days-1))),monthOf(iso(new Date()))]);
    for(const m of months)await loadMonth(m);

}

const dowOf = d => ((d.getDay()+6)%7)+1;

function sessKcal(x){if(x.skipped)return 0;if(x.kcal!=null&&x.kcal!=="")return Math.round(+x.kcal);const a=ACTS[x.act]||ACTS.annet;return Math.round((a.met[x.int??1]-1)*weightKg()*(+x.min||0)/60)}

function plannedBonus(ds){return Math.round(plannedFor(new Date(ds+"T12:00:00")).reduce((a,p)=>a+sessKcal(p),0)*S.exFactor/100)}
function trainDelta(ds){
  if(!trainInEnergy())return trainBonus(ds);
  let d=0;
  dayTrain(ds).forEach(x=>{
    if(x.planId){const p=S.program.find(q=>q.id===x.planId),pb=p?sessKcal(p):0;d+=x.skipped?-pb:sessKcal(x)-pb}
    else d+=sessKcal(x)});
  if(ds<iso(new Date()))d-=unregistered(ds).reduce((a,p)=>a+sessKcal(p),0);
  return Math.round(d*S.exFactor/100);
}
function unregistered(ds){const done=dayTrain(ds);return plannedFor(new Date(ds+"T12:00:00")).filter(p=>!done.some(x=>x.planId===p.id))}
function autoMissed(ds){return trainInEnergy()&&ds<iso(new Date())?Math.round(unregistered(ds).reduce((a,p)=>a+sessKcal(p),0)*S.exFactor/100):0}
function pendingTrain(ds){return trainInEnergy()&&ds===iso(new Date())?Math.round(unregistered(ds).reduce((a,p)=>a+sessKcal(p),0)*S.exFactor/100):0}
function trainBonus(ds){
  const burn=dayTrain(ds).reduce((a,x)=>{
    return a+sessKcal(x)},0);

/* ---------- Kosekvote ---------- */
function weekDates(ds){const d=new Date(ds+"T12:00:00");const off=dowOf(d)-1;return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()-off+i);return iso(x)})}
function kosDay(ds,future){
  const share=kosShare()/100,baseEarned=S.kcal*share,base=S.kcal*(1-share);
  const delta=future&&!dayTrain(ds).length?0:trainDelta(ds);
  const dl=dayLog(ds),t=dayTotals(dl);
  const kosE=((dl&&dl.extra)||[]).filter(e=>e.type==="Kos").reduce((a,e)=>a+(+e.kcal||0),0);
  const used=t.n?kosE+Math.max(0,(t.kcal-kosE)-base):0;
  return{earned:baseEarned+delta,barEarn:baseEarned+Math.max(0,delta),barUse:used+Math.max(0,-delta),baseEarned,delta,pending:future?0:pendingTrain(ds),auto:future?0:autoMissed(ds),used,kosE,base,logged:t.n>0};
}
function kosStatus(ds){
  const wk=weekDates(ds),today=iso(new Date());let missed=0,carry=0,cur=null,future=0;const days=[];
  for(const x of wk){const isFut=x>today;const k=kosDay(x,isFut);days.push({ds:x,...k,fut:isFut});
    if(x<ds){carry+=k.earned-k.used;missed+=Math.max(0,-k.delta)}else if(x===ds)cur=k;else future+=k.earned;}
  const avail=carry+cur.earned-cur.used;
  return{carry,missed,cur,avail,future,days,weekLeft:avail+future};
}

    <div class="kos-rows"><span>Overført fra tidligere i uka${k.missed?`<br><small class="flag">herav −${nf(k.missed)} for trening som ikke ble gjennomført</small>`:""}</span><span>${nf(k.carry)}</span><span>Opptjent i dag</span><span>+${nf(k.cur.baseEarned)}</span>${k.cur.delta?`<span>${k.cur.delta>0?"Trening utover programmet":"Planlagt trening ikke gjennomført"}</span><span>${k.cur.delta>0?"+":"−"}${nf(Math.abs(k.cur.delta))}</span>`:""}<span>Brukt i dag</span><span>−${nf(k.cur.used)}</span></div>
    ${k.cur.pending||k.cur.auto?`<p class="note flag" style="margin:0">${k.cur.auto?`Planlagt trening ble ikke registrert, så ${nf(k.cur.auto)} kcal er trukket fra kvoten. Glemte du å logge en økt du gjennomførte, trykker du «Gjennomført», så fjernes trekket.`:`Dagens planlagte trening er ikke registrert ennå. Er den ikke registrert når dagen er over, trekkes ${nf(k.cur.pending)} kcal. Du kan endre det i etterkant.`}</p>
    <div class="actions">${unregistered(ds).map(p=>`<button class="btn sm" data-tdone="${p.id}">${ICON.tick}${esc(sessName(p))} gjennomført</button><button class="btn sm" data-tskip="${p.id}">Hoppet over</button>`).join("")}</div>`:""}
    <div class="weekstrip" role="img" aria-label="Kosekvote per dag denne uka">${k.days.map((d,i)=>`<div class="wday ${d.fut?"future":""} ${d.ds===ds?"sel":""}"><div class="wbar"><span class="earn" style="height:${d.barEarn/mx*100}%"></span><span class="use" style="height:${d.barUse/mx*100}%"></span></div>${DOWS[i]}</div>`).join("")}</div>
    <div class="legend"><span><i class="dot c-e"></i>Opptjent</span><span><i class="dot c-p"></i>Brukt eller trukket for trening som ikke ble gjennomført</span></div>
    <div class="actions"><button class="btn sm primary" data-logedit="x:kos">${ICON.plus}Før opp kos</button></div>

function renderTrening(){
  const el=$("#v-trening");if(!el)return;
  if(TVIEW==="kropp"){el.innerHTML=kroppHtml();bindChart();return}

  const date=addDays(S.start,logDay),ds=iso(date);
  const wk=weekDates(ds);let plannedN=0,doneN=0,mins=0,burn=0;

  else if(id==="me-ex"){S.exFactor=+t.value}

    dl.train.push({planId:p.id,act:p.act,title:p.title||"",min:0,int:p.int,skipped:true,kcal:null,t:Date.now()});saveLog(ds);renderAll();

/* ---------- Porsjoner etter kaloribehov ---------- */
/* Planlagt kaloribehov for en dag i perioden: behov uten trening + andel av de øktene som er planlagt den dagen */
function planKcal(d){return S.kcal}
function avgPlanKcal(){let t=0;for(let d=0;d<S.days;d++)t+=planKcal(d);return t/S.days}
function myPortion(r,meal,d){
  if(!r)return 1;if(r.own&&r.fixed)return r.myFix;if(!S.scalePortion)return 1;
  const tgt=planKcal(d)*(+S.split[meal]||0)/100*(1+(r.own?0:WADJ));if(!(tgt>0))return 1;
  return Math.min(2.5,Math.max(.5,Math.round(tgt/kcal(r)*10)/10));
}
const totalPortions = (r,meal,d) => myPortion(r,meal,d)+Math.max(0,S.persons-1);
function portionPen(r,meal,d){
  if(!S.scalePortion)return 0;const tgt=planKcal(d)*(+S.split[meal]||0)/100;if(!(tgt>0))return 0;
  return Math.max(0,Math.abs(Math.log(tgt/kcal(r)))-.15)*1.5;
}
const portionChoices = (r,meal,d) => [...new Set([.5,1,1.5,2,myPortion(r,meal,d)])].sort((a,b)=>a-b);

/* ---------- Kropp: målinger og prognose ---------- */
let TVIEW=(()=>{try{return localStorage.getItem("matplan:tview")||"okter"}catch(e){return"okter"}})();
let PSCN=null;
const STR_ACTS=["styrke","hiit"];
const nf1 = n => (Math.round(n*10)/10).toLocaleString("nb-NO",{minimumFractionDigits:1,maximumFractionDigits:1});
const sgn1 = n => (n>0?"+":n<0?"−":"±")+nf1(Math.abs(n));
function segHtml(){return`<div class="seg2" role="group" aria-label="Visning"><button class="${TVIEW!=="kropp"?"on":""}" data-tview="okter" aria-pressed="${TVIEW!=="kropp"}">Økter</button><button class="${TVIEW==="kropp"?"on":""}" data-tview="kropp" aria-pressed="${TVIEW==="kropp"}">Kropp og prognose</button></div>`}
function bodySorted(){return[...(S.body||[])].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function latestW(){const b=bodySorted().filter(m=>+m.w>0);return b.length?+b[b.length-1].w:(+S.me.w||0)}
function navyBF(m){
  const h=+S.me.h;if(!h||!(+m.waist>0)||!(+m.neck>0))return null;
  if(S.me.sex==="m"){if(+m.waist<=+m.neck)return null;return 495/(1.0324-0.19077*Math.log10(m.waist-m.neck)+0.15456*Math.log10(h))-450}
  if(S.me.sex==="k"){if(!(+m.hip>0))return null;return 495/(1.29579-0.35004*Math.log10(+m.waist+ +m.hip-m.neck)+0.22100*Math.log10(h))-450}
  return null;
}
function bfOf(m){const v=+m.bf>0?+m.bf:navyBF(m);return v!=null&&v>2&&v<70?v:null}
function rmrRaw(w){const m=S.me;return(10*w+6.25*m.h-5*m.age+(m.sex==="m"?5:-161))*m.pal}
function rmrAt(w){return rmrRaw(w)+adaptOffset()}
const pastDays = n => {const out=[];for(let i=1;i<=n;i++){const d=new Date();d.setDate(d.getDate()-i);out.push(iso(d))}return out};
function scenario(kind){
  const w=latestW();if(!meReady()||!(w>0))return null;
  if(kind==="plan"){
    return{kind,w,intake:S.kcal,burn:S.program.reduce((a,p)=>a+sessKcal(p)*p.dows.length,0)/7,
      prot:S.kcal*PROFILES[S.profile].p/100/4,str:S.program.filter(p=>STR_ACTS.includes(p.act)).reduce((a,p)=>a+p.dows.length,0)};
  }
  const logged=pastDays(14).map(ds=>dayTotals(dayLog(ds))).filter(t=>t.n>0);
  if(logged.length<3)return null;
  const td=pastDays(28);
  return{kind,w,days:logged.length,intake:logged.reduce((a,t)=>a+t.kcal,0)/logged.length,
    burn:td.reduce((a,ds)=>a+trainBurn(ds),0)/td.length,prot:logged.reduce((a,t)=>a+t.p,0)/logged.length,
    str:td.reduce((a,ds)=>a+dayTrain(ds).filter(x=>!x.skipped&&STR_ACTS.includes(x.act)).length,0)/4};
}
/* Andel av vektendringen som er fettfri masse (muskler, vann, glykogen). Grove anslag fra litteraturen. */
function leanShare(bal,protRel,str){
  if(bal<0){let f=.25;if(protRel>=1.6)f-=.1;else if(protRel>=1.2)f-=.05;else if(protRel<.8)f+=.05;if(str>=2)f-=.1;else if(str>=1)f-=.05;if(bal<-750)f+=.05;return Math.min(.4,Math.max(.03,f))}
  let f=.15;if(str>=2)f+=.25;else if(str>=1)f+=.1;if(protRel>=1.6)f+=.1;else if(protRel<1.2)f-=.05;return Math.min(.55,Math.max(.05,f));
}
function project(sc,weeks){
  let w=sc.w,cumL=0,cumF=0;const out=[{wk:0,w,cumL,cumF,bal:null}];
  for(let k=1;k<=weeks;k++){
    const maint=rmrAt(w)+sc.burn*w/sc.w,bal=sc.intake-maint,protRel=sc.prot/w;
    let dW,dL,recomp=false;
    if(Math.abs(bal)<150&&sc.str>=2&&protRel>=1.6){dW=bal*7/7700;dL=.025;recomp=true}
    else{const f=leanShare(bal,protRel,sc.str);dW=bal*7/(f*1800+(1-f)*7700);dL=dW*f}
    w+=dW;cumL+=dL;cumF+=dW-dL;out.push({wk:k,w,cumL,cumF,bal,recomp});
  }
  return out;
}
function trendKgWeek(){
  const cut=iso(new Date(Date.now()-42*864e5));const pts=bodySorted().filter(m=>+m.w>0&&m.date>=cut).map(m=>({x:new Date(m.date+"T12:00:00")/864e5,y:+m.w}));
  if(pts.length<2||pts[pts.length-1].x-pts[0].x<10)return null;
  const mx=pts.reduce((a,p)=>a+p.x,0)/pts.length,my=pts.reduce((a,p)=>a+p.y,0)/pts.length;
  const num=pts.reduce((a,p)=>a+(p.x-mx)*(p.y-my),0),den=pts.reduce((a,p)=>a+(p.x-mx)**2,0);
  return den?num/den*7:null;
}
function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r)));const n=r/p;return(n<1.5?1:n<3?2:n<7?5:10)*p}
let CHART=null;
function weightChart(pr,startDs,retro){
  const meas=bodySorted().filter(m=>+m.w>0).map(m=>({t:new Date(m.date+"T12:00:00").getTime(),w:+m.w,lbl:fmtShort(new Date(m.date+"T12:00:00"))+": "+nf1(m.w)+" kg målt"}));

let ADAPT, RETRO=null;
function adaptInfo(){
  if(ADAPT!==undefined)return ADAPT;
  const res={ok:false};ADAPT=res;
  if(!meReady())return res.reason="Fyll inn Om deg.",res;
  const since=pastDays(35).slice(-1)[0];
  const today=iso(new Date());const ws=bodySorted().filter(m=>+m.w>0&&m.date>=since&&m.date<=today);
  if(ws.length<3)return res.reason=`Trenger minst 3 veiinger de siste 5 ukene (har ${ws.length}).`,res;
  const a=ws[0].date,b=ws[ws.length-1].date,span=Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
  if(span<14)return res.reason=`Veiingene må spenne over minst 14 dager (nå ${span}).`,res;
  const days=[];for(let d=new Date(a+"T12:00:00");iso(d)<b;d.setDate(d.getDate()+1))days.push(iso(d));
  const logged=days.map(ds=>dayTotals(dayLog(ds))).filter(t=>t.n>0);
  if(logged.length<days.length*.7)return res.reason=`Trenger matlogg for minst 70 % av dagene mellom veiingene (har ${logged.length} av ${days.length}).`,res;
  const intake=logged.reduce((x,t)=>x+t.kcal,0)/logged.length;
  const train=days.reduce((x,ds)=>x+trainBurn(ds),0)/days.length;
  const pts=ws.map(m=>({x:new Date(m.date+"T12:00:00")/864e5,y:+m.w}));
  const mx=pts.reduce((x,p)=>x+p.x,0)/pts.length,my=pts.reduce((x,p)=>x+p.y,0)/pts.length;
  const slope=pts.reduce((x,p)=>x+(p.x-mx)*(p.y-my),0)/pts.reduce((x,p)=>x+(p.x-mx)**2,0);
  const model=rmrRaw(my)+train, observed=intake-slope*7700;
  Object.assign(res,{ok:true,intake,train,slope,model,observed,days:days.length,logged:logged.length,span,offset:Math.max(-400,Math.min(400,Math.round((observed-model)/10)*10))});
  return res;
}
function adaptOffset(){if(S.me.adaptive===false)return 0;const a=adaptInfo();return a.ok?a.offset:0}
const progBurnFull = () => S.program.reduce((a,p)=>a+sessKcal(p)*p.dows.length,0)/7;
/* Hva vekten skulle ha vært ut fra loggen, fra første veiing til i dag (uten justering). Dager uten matlogg regnes som planen. */
function retroSim(){
  const b=bodySorted().filter(m=>+m.w>0);if(!b.length||!meReady())return null;
  let w=+b[0].w,loggedN=0,n=0;const pts=[{t:new Date(b[0].date+"T12:00:00").getTime(),w}];
  const today=iso(new Date());
  for(let d=new Date(b[0].date+"T12:00:00");iso(d)<today;d.setDate(d.getDate()+1)){
    const ds=iso(d),t=dayTotals(dayLog(ds));n++;
    const bal=t.n?(loggedN++,t.kcal-(rmrRaw(w)+trainBurn(ds))):S.kcal-(rmrRaw(w)+progBurnFull());
    w+=bal/7700;
    const nd=new Date(d);nd.setDate(nd.getDate()+1);if(n%7===0||iso(nd)===today)pts.push({t:nd.getTime(),w});
  }
  return n?{pts,w,n,loggedN}:null;

function planProfile(){
  if(PPROF)return PPROF;const base=PROFILES[S.profile];PPROF=base;
  let E=0,pE=0,fE=0,kE=0,rest=0;
  for(let d=0;d<S.days;d++){const ds=iso(addDays(S.start,d));
    MEALS.forEach(m=>{if(!S.meals[m]||skips[ds+"|"+m])return;const tgt=S.kcal*(+S.split[m]||0)/100;const op=S.ownPlaced[ds+"|"+m];const r=op&&RBY["own:"+op];
      if(r){const q=myPortion(r,m,d),e=kcal(r)*q;E+=e;pE+=r.mac[0]*4*q;fE+=r.mac[1]*9*q;kE+=r.mac[2]*4*q}else rest+=tgt})}
  if(!E||!rest)return PPROF;

/* ---------- Perioder: arkiv, automatisk ny periode og navigering ---------- */
let PERIODS=store.get("periods",{}), PMETA=store.get("periodsMeta",{updatedAt:0}), VIEW_CHOSEN=false;
const periodEnd = p => iso(addDays(p.start,p.days-1));
const daysBetween = (a,b) => Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
function stashCurrent(){if(P&&P.slots&&S.start)PERIODS[S.start]={seed:P.seed,slots:clean(P.slots),sig:P.sig,start:S.start,days:S.days,checked:clean(checked||{})}}
function savePeriods(onlyCloud){
  if(!onlyCloud){const cut=iso(addDays(iso(new Date()),-400));Object.keys(PERIODS).forEach(k=>{if(k<cut)delete PERIODS[k]});PMETA.updatedAt=Date.now()}
  store.set("periods",PERIODS);store.set("periodsMeta",PMETA);
  cloudWrite("periods",()=>clean({periods:PERIODS,updatedAt:PMETA.updatedAt}));
}
function sortedPeriods(){stashCurrent();return Object.values(PERIODS).sort((a,b)=>a.start<b.start?-1:1)}
function loadPeriod(start){
  stashCurrent();const p=PERIODS[start];if(!p)return;
  S.start=p.start;S.days=p.days;P={seed:p.seed,slots:clean(p.slots),sig:p.sig};checked=clean(p.checked||{});
  logDay=null;ensurePlan();save();renderAll();window.scrollTo(0,0);
}
function createPeriod(start,days,quiet){
  stashCurrent();S.start=start;S.days=days;checked={};P=generate(Math.floor(Math.random()*1e9));logDay=null;
  stashCurrent();if(!quiet){save();renderAll();window.scrollTo(0,0)}
}
/* Ved oppstart: lag en ny periode hvis dagens dato er etter siste periode, og vis perioden som inneholder i dag. */
function rollPeriods(quiet){
  const today=iso(new Date());const ps=sortedPeriods();if(!ps.length)return;
  let cur=ps.find(p=>p.start<=today&&periodEnd(p)>=today),rolled=false;
  if(!cur){const last=ps[ps.length-1];
    if(periodEnd(last)<today){const len=S.days||last.days;const k=Math.floor(daysBetween(last.start,today)/len);
      const start=k*len>=last.days?iso(addDays(last.start,k*len)):iso(addDays(periodEnd(last),1));
      createPeriod(start,len,true);cur=PERIODS[start];rolled=true}}
  if(cur&&!VIEW_CHOSEN&&cur.start!==S.start){const p=cur;S.start=p.start;S.days=p.days;P={seed:p.seed,slots:clean(p.slots),sig:p.sig};checked=clean(p.checked||{});logDay=null;ensurePlan()}
  if(rolled){META.updatedAt=Date.now();persistLocal();queueState();savePeriods();setTimeout(()=>toast("Ny periode er laget: "+fmtShort(addDays(S.start,0))+" – "+fmtShort(addDays(S.start,S.days-1))),400)}
}
function periodState(){const t=iso(new Date());return periodEnd({start:S.start,days:S.days})<t?"past":S.start>t?"future":"current"}
function periodBadge(){
  const st=periodState();
  const lbl={past:"Tidligere periode",future:"Planlagt periode",current:"Denne perioden"}[st];
  return`<div class="pstat"><span class="status ${st==="current"?"ok":st==="future"?"warn":""}">${lbl}</span>${st!=="current"?`<button class="btn sm" data-per="today">Gå til i dag</button>`:""}</div>`;
}
function navPeriod(dir){
  VIEW_CHOSEN=true;const ps=sortedPeriods();const i=ps.findIndex(p=>p.start===S.start);
  if(dir==="today"){VIEW_CHOSEN=false;const t=iso(new Date());const c=ps.find(p=>p.start<=t&&periodEnd(p)>=t);if(c)loadPeriod(c.start);else{rollPeriods();renderAll()}return}
  if(dir<0){if(i>0)loadPeriod(ps[i-1].start);return}
  if(i<ps.length-1)return loadPeriod(ps[i+1].start);
  const start=iso(addDays(periodEnd({start:S.start,days:S.days}),1));createPeriod(start,S.days);toast("Neste periode er planlagt");
}

Produkt: ${n||"(ukjent)"}. Merke: ${brand||"(ukjent)"}. Enhet: ${u==="stk"?"per stykk":"per 100 "+u}.

Næringsverdiene skal være ${u==="stk"?"per stykk":"per 100 "+u}. "pakning" er pakningsstørrelsen i ${u==="stk"?"antall stykk":u} eller 0 hvis ukjent. "sikker" er true bare når tallene er lest av et bilde.`;
  const opts={modelTier:"default"};if(FCTX.photo)opts.images=[FCTX.photo];
  try{
    const r=await SAMPLE.json(prompt,opts);const num=x=>Math.max(0,Math.round((Number(x)||0)*10)/10);
    if(!(num(r.kcal)>0))throw{code:"invalid_json"};
    $("#fd-kcal").value=num(r.kcal);$("#fd-p").value=num(r.protein);$("#fd-f").value=num(r.fett);$("#fd-k").value=num(r.karbo);
    if(!n&&r.produkt)$("#fd-n").value=String(r.produkt).slice(0,60);if(!brand&&r.merke)$("#fd-brand").value=String(r.merke).slice(0,40);
    if(!$("#fd-size").value&&num(r.pakning)>0)$("#fd-size").value=num(r.pakning);
    out.textContent=FCTX.photo?"Lest av fra bildet. Sjekk tallene mot pakken før du lagrer.":"Anslått ut fra navn og merke. Sjekk mot pakken når du har den for hånden.";
  }catch(e){out.textContent=e&&e.code==="rate_limited"?"For mange forespørsler. Prøv igjen litt senere.":e&&e.code==="image_rejected"?"Bildet kunne ikke brukes. Prøv et annet.":"Fikk ikke lest av tallene. Skriv dem inn selv.";out.classList.add("err")}
  finally{btn.disabled=false}
}
function saveFood(){
  const g=id=>$("#"+id).value,num=id=>g(id)===""?"":Math.max(0,Math.round(+g(id)*10)/10);
  const prev=S.foods.find(x=>x.id===FCTX.id)||{};
  const f={...prev,id:FCTX.id,n:g("fd-n").trim(),brand:g("fd-brand").trim(),unit:fdUnit(),size:num("fd-size"),kcal:num("fd-kcal"),p:num("fd-p"),f:num("fd-f"),k:num("fd-k")};
  const out=$("#fd-out");out.className="note estout";
  if(!f.n){out.textContent="Skriv navnet på produktet.";out.classList.add("err");return}
  if(!(+f.kcal>0)){out.textContent=`Fyll inn kalorier ${perLbl(f)}.`;out.classList.add("err");return}
  if(FCTX.isNew)S.foods.push(f);else S.foods=S.foods.map(x=>x.id===f.id?f:x);
  save();renderOppsett();const back=FCTX.returnTo;
  if(back){logDay=back.day;openLog(back.key);LOGCTX.items=back.items||[];showLib(true);pickLib(f.id);toast("Lagt i biblioteket");return}
  closeSheet();renderOppsett();toast("Lagt i biblioteket");
}
function libChange(t){
  if(t.id==="fd-photo"){const f=t.files&&t.files[0];FCTX.photo=f||null;const img=$("#fd-prev");if(f&&img){try{img.src=URL.createObjectURL(f);img.hidden=false}catch(e){}}return true}
  if(t.name==="fd-unit"){const u=t.value;$("#fd-sizelbl").textContent=u==="stk"?"Antall stk i pakken":"Pakningsstørrelse, "+u;$("#fd-perlbl").textContent="Næringsinnhold "+(u==="stk"?"per stk":"per 100 "+u);return true}
  if((t.id||"").startsWith("fd-")||t.id==="lib-q"||t.id==="lib-amt")return true;
  return false;
}
function libClick(t){
  const d=t.dataset;
  if(t.id==="l-lib"){showLib();return true}
  if(d.libpick!==undefined){pickLib(d.libpick);return true}
  if(d.libamt!==undefined){setItemAmt(+d.libamt);return true}
  if(d.libedit!==undefined){const i=+d.libedit;if(LIBSEL===i)closeAmt();else editItem(i);return true}
  if(d.libdel!==undefined){delItem(+d.libdel);return true}
  if(t.id==="lib-done"){closeAmt();return true}
  if(d.fedit!==undefined){openFood(d.fedit,d.fromlog==="1");return true}
  if(t.id==="fd-est"){foodEstimate();return true}
  if(t.id==="fd-save"){saveFood();return true}
  if(t.id==="fd-cancel"){const b=FCTX.returnTo;if(b){logDay=b.day;openLog(b.key);LOGCTX.items=b.items||[];showLib(true);if(LOGCTX.items.length)applyItems()}else closeSheet();return true}
  if(d.fdel!==undefined){S.foods=S.foods.filter(x=>x.id!==d.fdel);save();closeSheet();renderOppsett();toast("Matvaren er slettet");return true}
  return false;
}

/* ---------- Appversjon og oppdatering (bare i installert app) ---------- */
const swOn = () => "serviceWorker" in navigator && !!navigator.serviceWorker.controller;
function appVerCard(){
  if(!swOn())return"";
  return`<div class="card"><div class="field"><span class="t">Appversjon</span><span class="hint" id="appver">Versjon …</span><div class="actions"><button class="btn" id="upd-check">Se etter oppdatering</button></div><p class="note" id="upd-out" hidden></p></div></div>`;
}
async function appVersion(){try{const k=(await caches.keys()).filter(x=>/^matplan-[0-9a-f]{10}$/.test(x));return k.length?k[k.length-1].slice(8):null}catch(e){return null}}
async function fillAppVer(){const el=$("#appver");if(!el)return;const v=await appVersion();if($("#appver"))$("#appver").textContent=v?"Versjon "+v:"Versjon ukjent"}
async function checkUpdate(){
  const out=$("#upd-out"),btn=$("#upd-check");out.hidden=false;out.className="note";btn.disabled=true;out.textContent="Ser etter ny versjon …";
  try{
    const reg=await navigator.serviceWorker.getRegistration();if(!reg)throw 0;
    await reg.update();
    const nw=reg.installing||reg.waiting;
    if(nw){out.textContent="Ny versjon funnet. Den lastes ned, og du får beskjed når den er klar.";
      if(reg.waiting)reg.waiting.postMessage&&reg.waiting.postMessage("skipWaiting");}
    else out.textContent="Du har nyeste versjon som er publisert. Har du nettopp kjørt git push, kan GitHub bruke noen minutter før den er ute.";
  }catch(e){out.textContent="Fikk ikke sjekket. Er telefonen på nett?";out.classList.add("err")}
  finally{btn.disabled=false;fillAppVer()}
}

/* ---------- Boot ---------- */
syncKcal(); ensurePlan(); rollPeriods(true); persistLocal(); renderAll(); setTab(store.get("tab","meny")); initCloud();
</script>

<script>
/* Installerbar app: offline-støtte, varig lagring og snarveier */
(function(){
  if("serviceWorker" in navigator&&location.protocol!=="file:"){
    var hadCtl=!!navigator.serviceWorker.controller,shown=false;
    function banner(){
      if(shown)return;shown=true;
      var b=document.createElement("div");
      b.setAttribute("role","status");
      b.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9999;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#1f2a24;color:#fff;font:14px/1.35 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25)";
      b.innerHTML='<span style="flex:1">Ny versjon av Matplan er klar.</span><button style="border:0;border-radius:999px;padding:8px 14px;background:#fff;color:#1f2a24;font:600 14px system-ui,sans-serif">Oppdater</button>';
      b.querySelector("button").onclick=function(){location.reload()};
      document.body.appendChild(b);
    }
    navigator.serviceWorker.addEventListener("controllerchange",function(){if(hadCtl)banner();hadCtl=true});
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){
        function check(){reg.update().catch(function(){})}
        document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")check()});
        setInterval(check,30*60*1000);
      }).catch(function(e){console.warn("Service worker:",e)});
    });
  }
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  function fromHash(){var h=(location.hash||"").slice(1);if(["meny","liste","logg","trening","oppsett"].indexOf(h)>=0){try{setTab(h)}catch(e){}}}
  fromHash();window.addEventListener("hashchange",fromHash);
})();
</script>
